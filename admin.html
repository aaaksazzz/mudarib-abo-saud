<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>لوحة الإدارة 👑</h1><div class="card"><h2>إضافة قسم تحليل</h2><input id="name" placeholder="اسم القسم"><textarea id="desc" placeholder="الوصف"></textarea><button id="add" class="primary">إضافة</button></div><div class="card"><h2>تفعيل Premium لشهر</h2><input id="email" placeholder="إيميل العميل"><button id="activate" class="primary">تفعيل</button></div><div class="card"><h2>الأقسام الحالية</h2>{% for s in sections %}<p>• {{s['name']}} — {% if s['premium'] %}Premium{% else %}مجاني{% endif %}</p>{% endfor %}</div><script>const k=new URLSearchParams(location.search).get('key');add.onclick=async()=>{await fetch('/admin/section?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,description:desc.value,premium:1})});location.reload()};activate.onclick=async()=>{await fetch('/admin/activate?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});alert('تم التفعيل')};</script></main></body></html>
