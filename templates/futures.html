{% extends "base.html" %}

{% block content %}
<section id="futures" class="section">
  <div class="section-head">
    <div>
      <h2>📈 الفيوتشر</h2>
      <p>تحليل عقود OKX Futures — USDT SWAP.</p>
    </div>
    <button class="btn primary" id="refreshFutures">🔄 تحديث</button>
  </div>

  <div class="scanner-note" id="futuresStatus">جاهز للفحص</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>العقد</th>
          <th>السعر</th>
          <th>الإشارة</th>
          <th>القوة</th>
          <th>RSI</th>
          <th>الدخول</th>
          <th>الهدف</th>
          <th>الوقف</th>
        </tr>
      </thead>
      <tbody id="futuresBody"></tbody>
    </table>
  </div>

  <div id="futuresList" class="cards-list" hidden></div>
</section>
{% endblock %}
