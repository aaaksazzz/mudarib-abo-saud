{% extends "base.html" %}

{% block content %}
<header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><h1 id="pageTitle">{{ page_title }}</h1><span id="systemStatus">جاري الاتصال...</span></div><div class="market-switcher"><span>السوق</span><select id="marketSelect" class="input"><option value="crypto">🪙 العملات الرقمية</option><option value="saudi">🇸🇦 السوق السعودي</option><option value="usmarket">🇺🇸 السوق الأمريكي</option><option value="forex">💱 الفوركس</option><option value="futures">📈 الفيوتشر</option></select></div><div class="top-actions"><span id="userBadge" class="user-badge">زائر</span><button class="btn secondary" id="loginBtn">دخول</button><button class="btn primary" id="registerBtn">حساب جديد</button><button class="btn danger" id="logoutBtn" hidden>خروج</button></div></header>{% block content %}<section id="scanner" class="section">

  <div class="section-head">

    <div>

      <h2>
        ماسح الفرص
      </h2>

      <p>
        اختَر الفريم والإشارة ورتّب النتائج.
      </p>

    </div>

    <button class="btn primary" id="scanBtn">
      🔄 تحديث
    </button>

  </div>


  <div class="toolbar">

    <div class="chips" id="intervalChips">

      <button class="active" data-interval="15m">
        15m
      </button>

      <button data-interval="5m">
        5m
      </button>

      <button data-interval="1h">
        1h
      </button>

      <button data-interval="4h">
        4h
      </button>

      <button data-interval="1d">
        1D
      </button>

    </div>


    <div class="chips signal-chips">

      <button data-signal="شراء قوي">
        شراء قوي
      </button>

      <button data-signal="شراء">
        شراء
      </button>

      <button data-signal="حيادي">
        حيادي
      </button>

      <button data-signal="بيع">
        بيع
      </button>

      <button data-signal="بيع قوي">
        بيع قوي
      </button>

    </div>


    <input
      id="scannerSearch"
      class="input search"
      placeholder="ابحث عن عملة..."
    >


    <select id="sortField" class="input">

      <option value="change">
        التغير %
      </option>

      <option value="score">
        قوة الإشارة
      </option>

      <option value="price">
        السعر
      </option>

      <option value="volume">
        الحجم
      </option>

      <option value="symbol">
        العملة
      </option>

      <option value="signal">
        الإشارة
      </option>

    </select>


    <button id="sortDir" class="btn secondary">
      ↓ تنازلي
    </button>

  </div>


  <div
    class="scanner-note"
    id="scannerStatus"
  >
    جاهز للفحص
  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>العملة</th>
          <th>السعر</th>
          <th>التغير %</th>
          <th>الإشارة</th>
          <th>القوة</th>
          <th>RSI</th>
          <th>الحجم 24س</th>
          <th>الدخول</th>
          <th>الهدف</th>
          <th>الوقف</th>
          <th>الفريم</th>

        </tr>

      </thead>

      <tbody id="scannerBody"></tbody>

    </table>

  </div>

</section>{% endblock %}
{% endblock %}
