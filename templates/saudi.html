{% extends "base.html" %}

{% block content %}
<section id="saudi" class="section">

  <div class="section-head">

    <div>

      <h2>
        🇸🇦 السوق السعودي
      </h2>

      <p>
        تحليل الأسهم السعودية والإشارات الفنية.
      </p>

    </div>

    <button
      class="btn primary"
      id="refreshSaudi"
    >
      🔄 تحديث
    </button>

  </div>


  <div
    class="scanner-note"
    id="saudiStatus"
  >
    جاهز للفحص
  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>السهم</th>
          <th>السعر</th>
          <th>الإشارة</th>
          <th>القوة</th>
          <th>RSI</th>
          <th>الدخول</th>
          <th>الهدف</th>
          <th>الوقف</th>

        </tr>

      </thead>

      <tbody id="saudiBody"></tbody>

    </table>

  </div>

</section>{% endblock %}
{% endblock %}
