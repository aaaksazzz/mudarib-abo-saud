{% extends "base.html" %}

{% block content %}
<section id="usmarket" class="section">

  <div class="section-head">

    <div>

      <h2>
        🇺🇸 السوق الأمريكي
      </h2>

      <p>
        تحليل الأسهم الأمريكية والإشارات الفنية.
      </p>

    </div>

    <button
      class="btn primary"
      id="refreshUSMarket"
    >
      🔄 تحديث
    </button>

  </div>


  <div
    class="scanner-note"
    id="usStatus"
  >
    جاهز للفحص
  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>السهم</th>
          <th>السعر</th>
          <th>الإشارة</th>
          <th>القوة</th>
          <th>RSI</th>
          <th>الدخول</th>
          <th>الهدف</th>
          <th>الوقف</th>

        </tr>

      </thead>

      <tbody id="usMarketBody"></tbody>

    </table>

  </div>

  <div
    id="usMarketList"
    class="cards-list"
    hidden
  ></div>

</section>{% endblock %}
{% endblock %}
