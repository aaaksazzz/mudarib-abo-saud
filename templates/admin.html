<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>دخول الإدارة | المضارب PRO</title><link rel="stylesheet" href="/static/style.css?v=114"></head><body><header><a class="brand" href="/">المضارب <span>PRO</span></a><button id="theme" class="icon" type="button" aria-label="الوضع الليلي">☾</button></header><main class="auth-wrap"><section class="auth-card" style="max-width:420px"><small>ADMIN ONLY</small><h1 id="adminTitle">دخول الإدارة</h1><p id="adminMsg">هذه الصفحة مخصصة للإدارة فقط.</p><form id="adminLogin" style="display:grid;gap:12px"><label for="adminUsername">اسم المستخدم</label><input id="adminUsername" name="username" type="text" autocomplete="username" required placeholder="أدخل اسم المستخدم"><label for="adminPassword">الرقم السري</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" required placeholder="أدخل الرقم السري"><button type="submit">دخول الإدارة</button></form><section id="adminPanel" hidden><div class="quick-grid"><a class="quick-card" href="/trades"><span>📊</span><b>متابعة الصفقات</b><small>عرض الصفقات والتحليل</small></a><a class="quick-card" href="/news"><span>📰</span><b>الأخبار والمدونة</b><small>إدارة المحتوى</small></a><a class="quick-card" href="/scanner"><span>🔎</span><b>الماسح الذكي</b><small>مراقبة الأسواق</small></a></div><button id="adminLogout" type="button" style="margin-top:16px">تسجيل خروج الإدارة</button></section><p style="margin-top:20px"><a href="/">العودة للرئيسية</a></p></section></main><script>const form=document.getElementById('adminLogin'),panel=document.getElementById('adminPanel'),msg=document.getElementById('adminMsg'),title=document.getElementById('adminTitle');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='جاري التحقق...';const r=await fetch('/api/admin/login',{method:'POST',body:new FormData(form)});const d=await r.json().catch(()=>({}));if(r.ok&&d.ok){form.hidden=true;panel.hidden=false;title.textContent='لوحة الإدارة';msg.textContent='تم تسجيل دخول الإدارة بنجاح.'}else msg.textContent=d.error||'تعذر تسجيل الدخول';});document.getElementById('adminLogout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()});</script></body></html>
