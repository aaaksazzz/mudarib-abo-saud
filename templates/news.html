<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأخبار | مضارب أبو سعود</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head><body data-page="news"><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">م</div><div><b>مضارب أبو سعود</b><small>تحليل الأسواق</small></div></div><nav><a class="nav-item{% if page_id == 'dashboard' %} active{% endif %}" data-section="dashboard" href="/">📊 الرئيسية</a>
<a class="nav-item{% if page_id == 'scanner' %} active{% endif %}" data-section="scanner" href="/scanner">🔎 ماسح الفرص</a>
<a class="nav-item{% if page_id == 'recent' %} active{% endif %}" data-section="recent" href="/recent">💰 صفقات سبوت</a>
<a class="nav-item{% if page_id == 'usmarket' %} active{% endif %}" data-section="usmarket" href="/usmarket">🇺🇸 صفقات الأمريكي</a>
<a class="nav-item{% if page_id == 'futures' %} active{% endif %}" data-section="futures" href="/futures">📈 صفقات الفيوتشر</a>
<a class="nav-item{% if page_id == 'forex' %} active{% endif %}" data-section="forex" href="/forex">💱 صفقات الفوركس</a>
<a class="nav-item{% if page_id == 'saudi' %} active{% endif %}" data-section="saudi" href="/saudi">🇸🇦 صفقات السعودي</a>
<a class="nav-item{% if page_id == 'news' %} active{% endif %}" data-section="news" href="/news">📰 الأخبار</a>
<a class="nav-item{% if page_id == 'subscription' %} active{% endif %}" data-section="subscription" href="/subscription">💳 الاشتراك</a></nav><div class="side-bottom"><a href="/admin" id="adminLink" hidden>🛠️ لوحة الإدارة</a><button id="themeBtn">🌙 الوضع الليلي</button></div></aside><main class="main"><header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><h1 id="pageTitle">{{ page_title }}</h1><span id="systemStatus">جاري الاتصال...</span></div><div class="market-switcher"><span>السوق</span><select id="marketSelect" class="input"><option value="crypto">🪙 العملات الرقمية</option><option value="saudi">🇸🇦 السوق السعودي</option><option value="usmarket">🇺🇸 السوق الأمريكي</option><option value="forex">💱 الفوركس</option><option value="futures">📈 الفيوتشر</option></select></div><div class="top-actions"><span id="userBadge" class="user-badge">زائر</span><button class="btn secondary" id="loginBtn">دخول</button><button class="btn primary" id="registerBtn">حساب جديد</button><button class="btn danger" id="logoutBtn" hidden>خروج</button></div></header>{% block content %}<section id="news" class="section">

  <div class="section-head">

    <div>

      <h2>
        📰 الأخبار
      </h2>

      <p>
        آخر أخبار الأسواق.
      </p>

    </div>

    <button
      class="btn secondary"
      id="newsBtn"
    >
      🔄 تحديث
    </button>

  </div>


  <div
    id="newsList"
    class="news-grid"
  ></div>

</section>{% endblock %}</main></div><div class="modal" id="authModal"><div class="modal-card"><button class="close" data-close="authModal">×</button><div class="auth-tabs"><button class="active" id="loginTab">دخول</button><button id="registerTab">حساب جديد</button></div><form id="loginForm"><input id="loginEmail" class="input" type="email" placeholder="البريد الإلكتروني" required><input id="loginPassword" class="input" type="password" placeholder="كلمة المرور" required><button class="btn primary full">دخول</button></form><form id="registerForm" hidden><input id="regName" class="input" placeholder="الاسم" required><input id="regEmail" class="input" type="email" placeholder="البريد الإلكتروني" required><input id="regPassword" class="input" type="password" placeholder="كلمة المرور" required><button class="btn primary full">إنشاء الحساب</button></form><div id="authMsg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script src="/static/app.js"></script></body></html>
