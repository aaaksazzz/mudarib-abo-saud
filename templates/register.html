<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب — مضارب أبو سعود</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="auth-page">

<main class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-logo">

            <div class="logo-icon">₿</div>

            <div>
                <strong>مضارب أبو سعود</strong>
                <span>تحليل العملات الرقمية</span>
            </div>

        </div>

        <div class="auth-heading">

            <h1>إنشاء حساب جديد</h1>

            <p>
                أنشئ حسابك للوصول إلى منصة التحليل.
            </p>

        </div>

        <div
            id="registerMessage"
            class="auth-message"
            style="display:none"
        ></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="registerName">
                    الاسم
                </label>

                <input
                    id="registerName"
                    type="text"
                    class="form-input"
                    placeholder="اكتب اسمك"
                    autocomplete="name"
                    minlength="2"
                    maxlength="80"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerEmail">
                    البريد الإلكتروني
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    class="form-input"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerPassword">
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    class="form-input"
                    placeholder="6 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerPasswordConfirm">
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerPasswordConfirm"
                    type="password"
                    class="form-input"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <button
                id="registerSubmitBtn"
                type="submit"
                class="btn btn-primary auth-submit"
            >
                👤 إنشاء الحساب
            </button>

        </form>

        <div class="auth-divider">
            <span>أو</span>
        </div>

        <div class="auth-footer">

            <span>
                عندك حساب بالفعل؟
            </span>

            <a href="/login">
                تسجيل الدخول
            </a>

        </div>

        <div class="auth-back">

            <a href="/">
                ← العودة للرئيسية
            </a>

        </div>

    </div>

</main>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("registerMessage");
const submitBtn = document.getElementById("registerSubmitBtn");

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "auth-message " + type;

    message.style.display = "block";
}

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const name =
        document
            .getElementById("registerName")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const passwordConfirm =
        document
            .getElementById("registerPasswordConfirm")
            .value;

    if (name.length < 2) {

        showMessage(
            "فضلاً اكتب الاسم بشكل صحيح."
        );

        return;
    }

    if (!email || !email.includes("@")) {

        showMessage(
            "فضلاً اكتب بريد إلكتروني صحيح."
        );

        return;
    }

    if (password.length < 6) {

        showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
        );

        return;
    }

    if (password !== passwordConfirm) {

        showMessage(
            "كلمتا المرور غير متطابقتين."
        );

        return;
    }

    submitBtn.disabled = true;

    submitBtn.textContent =
        "⏳ جاري إنشاء الحساب...";

    message.style.display = "none";

    try {

        const response = await fetch(
            "/api/auth/register",
            {
                method: "POST",

                credentials: "same-origin",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );

        const data =
            await response.json()
                .catch(() => ({}));

        if (!response.ok || data.ok === false) {

            showMessage(
                data.message ||
                data.error ||
                "تعذر إنشاء الحساب."
            );

            return;
        }

        /*
         * السيرفر عند التسجيل يقوم أصلًا
         * بإنشاء الجلسة وتسجيل المستخدم.
         *
         * لذلك نرجعه للرئيسية مباشرة.
         */

        showMessage(
            "تم إنشاء الحساب بنجاح ✅",
            "success"
        );

        setTimeout(() => {

            window.location.href = "/";

        }, 700);

    } catch (error) {

        console.error(error);

        showMessage(
            "تعذر الاتصال بالخادم. حاول مرة أخرى."
        );

    } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
            "👤 إنشاء الحساب";

    }

});

</script>

</body>
</html>
