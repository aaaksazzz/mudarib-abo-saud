<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">

    <title>إنشاء حساب — مضارب أبو سعود</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );
            color: #fff;
            min-height: 100vh;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 12px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f59e0b;
            color: #111827;
            font-size: 32px;
            font-weight: bold;
            box-shadow:
                0 10px 30px rgba(245, 158, 11, .25);
        }

        .auth-logo h1 {
            margin: 0;
            font-size: 26px;
        }

        .auth-logo p {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .auth-card {
            background: rgba(15, 23, 42, .94);
            border: 1px solid rgba(148, 163, 184, .16);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, .35);
            backdrop-filter: blur(12px);
        }

        .auth-card h2 {
            margin: 0;
            text-align: center;
            font-size: 22px;
        }

        .auth-subtitle {
            text-align: center;
            color: #94a3b8;
            margin: 9px 0 24px;
            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .auth-field label {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: bold;
        }

        .auth-field input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #020617;
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: .2s;
        }

        .auth-field input::placeholder {
            color: #64748b;
        }

        .auth-field input:focus {
            border-color: #f59e0b;
            box-shadow:
                0 0 0 3px rgba(245, 158, 11, .12);
        }

        .auth-field input:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
        }

        .auth-submit {
            width: 100%;
            min-height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            background: #f59e0b;
            color: #111827;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .auth-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .auth-submit:active {
            transform: translateY(0);
        }

        .auth-submit:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 11px;
            font-size: 14px;
            line-height: 1.7;
        }

        .auth-message.error {
            display: block;
            background: rgba(239, 68, 68, .12);
            border: 1px solid rgba(239, 68, 68, .35);
            color: #fca5a5;
        }

        .auth-message.success {
            display: block;
            background: rgba(34, 197, 94, .12);
            border: 1px solid rgba(34, 197, 94, .35);
            color: #86efac;
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .auth-links a,
        .auth-home {
            color: #fbbf24;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-links a:hover,
        .auth-home:hover {
            text-decoration: underline;
        }

        .auth-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .password-note {
            color: #64748b;
            font-size: 12px;
            margin-top: 2px;
        }

        @media (max-width: 480px) {

            .auth-page {
                padding: 14px;
            }

            .auth-card {
                padding: 22px 18px;
                border-radius: 17px;
            }

            .auth-logo h1 {
                font-size: 23px;
            }

            .brand-icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }

            .auth-field input {
                font-size: 16px;
            }
        }
    </style>
</head>

<body class="auth-page">

<main class="auth-container">

    <div class="auth-logo">

        <div class="brand-icon">₿</div>

        <h1>مضارب أبو سعود</h1>

        <p>تحليل العملات الرقمية</p>

    </div>


    <div class="auth-card">

        <h2>إنشاء حساب جديد</h2>

        <p class="auth-subtitle">
            أنشئ حسابك للوصول إلى منصة التحليل
        </p>


        <div
            id="registerMessage"
            class="auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <form
            id="registerForm"
            class="auth-form"
            autocomplete="on"
            novalidate
        >

            <div class="auth-field">

                <label for="registerName">
                    الاسم
                </label>

                <input
                    id="registerName"
                    name="name"
                    type="text"
                    placeholder="اكتب اسمك"
                    autocomplete="name"
                    minlength="2"
                    maxlength="80"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="registerEmail">
                    البريد الإلكتروني
                </label>

                <input
                    id="registerEmail"
                    name="email"
                    type="email"
                    inputmode="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    maxlength="160"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="registerPassword">
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    name="password"
                    type="password"
                    placeholder="6 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="6"
                    maxlength="128"
                    required
                >

                <div class="password-note">
                    يجب أن تكون كلمة المرور 6 أحرف على الأقل.
                </div>

            </div>


            <div class="auth-field">

                <label for="registerPasswordConfirm">
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerPasswordConfirm"
                    name="password_confirm"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    minlength="6"
                    maxlength="128"
                    required
                >

            </div>


            <button
                id="registerSubmitBtn"
                type="submit"
                class="auth-submit"
            >
                👤 إنشاء الحساب
            </button>

        </form>


        <div class="auth-links">

            عندك حساب بالفعل؟

            <a href="/login">
                تسجيل الدخول
            </a>

        </div>


        <a href="/" class="auth-home">
            ← العودة للرئيسية
        </a>

    </div>

</main>


<script>
"use strict";

(function () {

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("registerMessage");

    const submitBtn =
        document.getElementById("registerSubmitBtn");

    const nameInput =
        document.getElementById("registerName");

    const emailInput =
        document.getElementById("registerEmail");

    const passwordInput =
        document.getElementById("registerPassword");

    const confirmInput =
        document.getElementById("registerPasswordConfirm");


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "auth-message " +
            (type || "error");

        message.style.display = "block";
    }


    function hideMessage() {

        message.textContent = "";

        message.className =
            "auth-message";

        message.style.display = "none";
    }


    function setLoading(loading) {

        submitBtn.disabled = loading;

        if (loading) {

            submitBtn.textContent =
                "⏳ جاري إنشاء الحساب...";

        } else {

            submitBtn.textContent =
                "👤 إنشاء الحساب";
        }
    }


    function validEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email);
    }


    async function readResponse(response) {

        const contentType =
            response.headers.get("content-type") || "";

        if (contentType.includes("application/json")) {

            return await response
                .json()
                .catch(function () {
                    return {};
                });

        }

        const text =
            await response
                .text()
                .catch(function () {
                    return "";
                });

        return {
            ok: false,
            message: text || ""
        };
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessage();


            const name =
                nameInput.value.trim();

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;

            const passwordConfirm =
                confirmInput.value;


            if (name.length < 2) {

                showMessage(
                    "فضلاً اكتب الاسم بشكل صحيح."
                );

                nameInput.focus();

                return;
            }


            if (!validEmail(email)) {

                showMessage(
                    "فضلاً اكتب بريد إلكتروني صحيح."
                );

                emailInput.focus();

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
                );

                passwordInput.focus();

                return;
            }


            if (password !== passwordConfirm) {

                showMessage(
                    "كلمتا المرور غير متطابقتين."
                );

                confirmInput.focus();

                return;
            }


            setLoading(true);


            try {

                const response =
                    await fetch(
                        "/api/auth/register",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                name: name,

                                email: email,

                                password: password

                            })
                        }
                    );


                const data =
                    await readResponse(response);


                if (!response.ok || data.ok === false) {

                    let errorMessage =
                        data.message ||
                        data.error;


                    if (!errorMessage) {

                        if (response.status === 409) {

                            errorMessage =
                                "الحساب أو البريد الإلكتروني مستخدم مسبقاً.";

                        } else if (response.status === 400) {

                            errorMessage =
                                "البيانات المدخلة غير صحيحة.";

                        } else if (response.status === 500) {

                            errorMessage =
                                "حدث خطأ في الخادم. حاول مرة أخرى.";

                        } else {

                            errorMessage =
                                "تعذر إنشاء الحساب.";
                        }
                    }


                    showMessage(errorMessage);

                    return;
                }


                showMessage(
                    data.message ||
                    "تم إنشاء الحساب بنجاح ✅",
                    "success"
                );


                /*
                 * السيرفر عندك ينشئ جلسة للمستخدم
                 * لذلك ما نحتاج localStorage للجلسة.
                 */

                setTimeout(function () {

                    window.location.replace("/");

                }, 700);


            } catch (error) {

                console.error(
                    "REGISTER ERROR:",
                    error
                );

                showMessage(
                    "تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت وحاول مرة أخرى."
                );

            } finally {

                setLoading(false);

            }

        }
    );


    /*
     * تحقق مباشر من تطابق كلمات المرور
     */

    confirmInput.addEventListener(
        "input",
        function () {

            if (
                confirmInput.value &&
                passwordInput.value !==
                confirmInput.value
            ) {

                confirmInput.setCustomValidity(
                    "كلمتا المرور غير متطابقتين"
                );

            } else {

                confirmInput.setCustomValidity("");

            }

        }
    );


    passwordInput.addEventListener(
        "input",
        function () {

            if (
                confirmInput.value &&
                passwordInput.value !==
                confirmInput.value
            ) {

                confirmInput.setCustomValidity(
                    "كلمتا المرور غير متطابقتين"
                );

            } else {

                confirmInput.setCustomValidity("");

            }

        }
    );

})();
</script>

</body>
</html>
