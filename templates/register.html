<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب — مضارب أبو سعود</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-logo">

            <div class="brand-icon">₿</div>

            <h1>مضارب أبو سعود</h1>

            <p>تحليل العملات الرقمية</p>

        </div>

        <div class="auth-card">

            <h2>إنشاء حساب جديد</h2>

            <p class="auth-subtitle">
                أنشئ حسابك للوصول إلى منصة التحليل
            </p>

            <div
                id="registerMessage"
                class="auth-message"
                style="display:none"
            ></div>

            <form id="registerForm" class="auth-form">

                <div class="auth-field">

                    <label for="registerName">
                        الاسم
                    </label>

                    <input
                        id="registerName"
                        name="name"
                        type="text"
                        placeholder="اكتب اسمك"
                        autocomplete="name"
                        minlength="2"
                        maxlength="80"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="registerEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        id="registerEmail"
                        name="email"
                        type="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="registerPassword">
                        كلمة المرور
                    </label>

                    <input
                        id="registerPassword"
                        name="password"
                        type="password"
                        placeholder="6 أحرف على الأقل"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="registerPasswordConfirm">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        id="registerPasswordConfirm"
                        name="password_confirm"
                        type="password"
                        placeholder="أعد كتابة كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    id="registerSubmitBtn"
                    type="submit"
                    class="auth-submit"
                >
                    👤 إنشاء الحساب
                </button>

            </form>

            <div class="auth-links">

                عندك حساب بالفعل؟
                <a href="/login">
                    تسجيل الدخول
                </a>

            </div>

            <a href="/" class="auth-home">
                ← العودة للرئيسية
            </a>

        </div>

    </main>

    <script>

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("registerMessage");

    const submitBtn =
        document.getElementById("registerSubmitBtn");


    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "auth-message " + type;

        message.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document
                .getElementById("registerName")
                .value
                .trim();

        const email =
            document
                .getElementById("registerEmail")
                .value
                .trim()
                .toLowerCase();

        const password =
            document
                .getElementById("registerPassword")
                .value;

        const passwordConfirm =
            document
                .getElementById("registerPasswordConfirm")
                .value;


        if (name.length < 2) {

            showMessage(
                "فضلاً اكتب الاسم بشكل صحيح."
            );

            return;
        }


        if (!email || !email.includes("@")) {

            showMessage(
                "فضلاً اكتب بريد إلكتروني صحيح."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
            );

            return;
        }


        if (password !== passwordConfirm) {

            showMessage(
                "كلمتا المرور غير متطابقتين."
            );

            return;
        }


        submitBtn.disabled = true;

        submitBtn.textContent =
            "⏳ جاري إنشاء الحساب...";

        message.style.display = "none";


        try {

            const response =
                await fetch(
                    "/api/auth/register",
                    {
                        method: "POST",

                        credentials: "same-origin",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response
                    .json()
                    .catch(() => ({}));


            if (!response.ok || data.ok === false) {

                showMessage(
                    data.message ||
                    data.error ||
                    "تعذر إنشاء الحساب."
                );

                return;
            }


            showMessage(
                "تم إنشاء الحساب بنجاح ✅",
                "success"
            );


            setTimeout(function() {

                window.location.href = "/";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "تعذر الاتصال بالخادم. حاول مرة أخرى."
            );


        } finally {

            submitBtn.disabled = false;

            submitBtn.textContent =
                "👤 إنشاء الحساب";
        }

    });

    </script>

</body>
</html>
