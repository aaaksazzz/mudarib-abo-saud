<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page_title }} | مضارب أبو سعود</title>
  <link rel="stylesheet" href="/static/style.css?v=20260924">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-page="{{ page_id }}">
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">م</div>
      <div><b>مضارب أبو سعود</b><small>تحليل الأسواق</small></div>
    </div>
    <nav class="site-nav" aria-label="التنقل الرئيسي">
      <div class="nav-group">
        <span class="nav-group-title">الرئيسية</span>
        <a class="nav-item{% if page_id == 'dashboard' %} active{% endif %}" href="/" aria-current="{{ 'page' if page_id == 'dashboard' else 'false' }}">
          <span class="nav-icon">📊</span><span>الرئيسية</span>
        </a>
        <a class="nav-item{% if page_id == 'scanner' %} active{% endif %}" href="/scanner" aria-current="{{ 'page' if page_id == 'scanner' else 'false' }}">
          <span class="nav-icon">🔎</span><span>ماسح الفرص</span>
        </a>
        <a class="nav-item{% if page_id == 'recent' %} active{% endif %}" href="/recent" aria-current="{{ 'page' if page_id == 'recent' else 'false' }}">
          <span class="nav-icon">💰</span><span>صفقات سبوت</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">الأسواق</span>
        <a class="nav-item{% if page_id == 'saudi' %} active{% endif %}" href="/saudi" aria-current="{{ 'page' if page_id == 'saudi' else 'false' }}">
          <span class="nav-icon">🇸🇦</span><span>صفقات السعودي</span>
        </a>
        <a class="nav-item{% if page_id == 'usmarket' %} active{% endif %}" href="/usmarket" aria-current="{{ 'page' if page_id == 'usmarket' else 'false' }}">
          <span class="nav-icon">🇺🇸</span><span>صفقات الأمريكي</span>
        </a>
        <a class="nav-item{% if page_id == 'forex' %} active{% endif %}" href="/forex" aria-current="{{ 'page' if page_id == 'forex' else 'false' }}">
          <span class="nav-icon">💱</span><span>صفقات الفوركس</span>
        </a>
        <a class="nav-item{% if page_id == 'futures' %} active{% endif %}" href="/futures" aria-current="{{ 'page' if page_id == 'futures' else 'false' }}">
          <span class="nav-icon">📈</span><span>صفقات الفيوتشر</span>
        </a>
      </div>

      <div class="nav-group">
        <span class="nav-group-title">الخدمات</span>
        <a class="nav-item{% if page_id == 'news' %} active{% endif %}" href="/news" aria-current="{{ 'page' if page_id == 'news' else 'false' }}">
          <span class="nav-icon">📰</span><span>الأخبار</span>
        </a>
        <a class="nav-item{% if page_id == 'subscription' %} active{% endif %}" href="/subscription" aria-current="{{ 'page' if page_id == 'subscription' else 'false' }}">
          <span class="nav-icon">💳</span><span>الاشتراك</span>
        </a>
      </div>
    </nav>
    <div class="side-bottom">
      <a href="/admin" id="adminLink" hidden>🛠️ لوحة الإدارة</a>
      <button id="themeBtn">🌙 الوضع الليلي</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <h1 id="pageTitle">{{ page_title }}</h1>
        <span id="systemStatus">جاري الاتصال...</span>
      </div>
      <div class="market-switcher">
        <span>السوق</span>
        <select id="marketSelect" class="input">
          <option value="crypto">🪙 العملات الرقمية</option>
          <option value="saudi">🇸🇦 السوق السعودي</option>
          <option value="usmarket">🇺🇸 السوق الأمريكي</option>
          <option value="forex">💱 الفوركس</option>
          <option value="futures">📈 الفيوتشر</option>
        </select>
      </div>
      <div class="top-actions">
        <span id="userBadge" class="user-badge">زائر</span>
        <button class="btn secondary" id="loginBtn">دخول</button>
        <button class="btn primary" id="registerBtn">حساب جديد</button>
        <button class="btn danger" id="logoutBtn" hidden>خروج</button>
      </div>
    </header>

    {% block content %}{% endblock %}
  </main>
</div>

<div class="modal" id="authModal">
  <div class="modal-card">
    <button class="close" data-close="authModal">×</button>
    <div class="auth-tabs">
      <button class="active" id="loginTab">دخول</button>
      <button id="registerTab">حساب جديد</button>
    </div>
    <form id="loginForm">
      <input id="loginEmail" class="input" type="email" placeholder="البريد الإلكتروني" required>
      <input id="loginPassword" class="input" type="password" placeholder="كلمة المرور" required>
      <button class="btn primary full">دخول</button>
    </form>
    <form id="registerForm" hidden>
      <input id="regName" class="input" placeholder="الاسم" required>
      <input id="regEmail" class="input" type="email" placeholder="البريد الإلكتروني" required>
      <input id="regPassword" class="input" type="password" placeholder="كلمة المرور" required>
      <button class="btn primary full">إنشاء الحساب</button>
    </form>
    <div id="authMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="/static/app.js?v=20260924"></script>
</body>
</html>
