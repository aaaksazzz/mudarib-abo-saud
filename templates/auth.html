<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART TRADING PRO</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth"><a class="brand" href="/">SMART TRADING <b>PRO</b></a><form method="post"><h1>{{ 'تسجيل الدخول' if mode=='login' else 'إنشاء حساب' }}</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}{% if mode=='register' %}<label>اسم المستخدم<input name="username" required minlength="3"></label>{% endif %}<label>البريد الإلكتروني<input type="email" name="email" required></label><label>كلمة المرور<input type="password" name="password" required minlength="8"></label><button class="primary">{{ 'دخول' if mode=='login' else 'إنشاء الحساب' }}</button><p>{% if mode=='login' %}ما عندك حساب؟ <a href="/register">سجل الآن</a>{% else %}عندك حساب؟ <a href="/login">دخول</a>{% endif %}</p></form></main></body></html>
