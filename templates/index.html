<section id="opportunityScanner" class="page-section">
  <div class="section-header">
    <div>
      <h2>🔎 ماسح الفرص</h2>
      <p>فلترة العملات حسب الفاصل والإشارة والتغيّر</p>
    </div>

    <div class="scanner-controls">
      <select id="scannerInterval">
        <option value="5m">5 دقائق</option>
        <option value="15m" selected>15 دقيقة</option>
        <option value="1h">ساعة</option>
        <option value="4h">4 ساعات</option>
        <option value="1d">يومي</option>
      </select>

      <select id="scannerSignal">
        <option value="ALL">كل الإشارات</option>
        <option value="شراء قوي">🟢 شراء قوي</option>
        <option value="شراء">🟢 شراء</option>
        <option value="حيادي">⚪ حيادي</option>
        <option value="بيع">🔴 بيع</option>
        <option value="بيع قوي">🔴 بيع قوي</option>
      </select>

      <select id="scannerSort">
        <option value="change">التغيّر %</option>
        <option value="price">السعر</option>
        <option value="score">قوة الإشارة</option>
        <option value="volume">حجم التداول</option>
      </select>

      <button id="scanNowBtn" class="primary">🔎 فحص الآن</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="opportunity-table">
      <thead>
        <tr>
          <th>العملة</th>
          <th>السعر</th>
          <th>التغيّر %</th>
          <th>الإشارة</th>
          <th>القوة</th>
        </tr>
      </thead>
      <tbody id="opportunityRows">
        <tr>
          <td colspan="5">جاري الفحص...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>


<section id="recentTrades" class="page-section">
  <div class="section-header">
    <div>
      <h2>⚡ الصفقات الحديثة</h2>
      <p>أحدث الإشارات التي اكتشفها الماسح</p>
    </div>

    <button id="clearRecentBtn" class="secondary">
      مسح القائمة
    </button>
  </div>

  <div class="table-wrap">
    <table class="opportunity-table">
      <thead>
        <tr>
          <th>العملة</th>
          <th>السعر</th>
          <th>التغيّر</th>
          <th>الإشارة</th>
          <th>الفاصل</th>
          <th>الوقت</th>
        </tr>
      </thead>
      <tbody id="recentTradeRows">
        <tr>
          <td colspan="6">لا توجد صفقات حديثة</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
