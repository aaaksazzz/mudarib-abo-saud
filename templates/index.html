<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — مضارب أبو سعود</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-brand">
            <div class="brand-icon">م</div>
            <h1>مضارب أبو سعود</h1>
            <p>تسجيل الدخول</p>
        </div>

        <form id="loginPageForm">

            <label>البريد الإلكتروني</label>
            <input
                id="loginEmail"
                class="input"
                type="email"
                placeholder="البريد الإلكتروني"
                autocomplete="email"
                required
            >

            <label>كلمة المرور</label>
            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="btn primary full"
                id="loginSubmit"
            >
                دخول
            </button>

        </form>

        <div id="loginMsg"></div>

        <div class="auth-links">
            <span>ما عندك حساب؟</span>
            <a href="/register">إنشاء حساب جديد</a>
        </div>

        <a href="/" class="back-home">
            ← العودة للموقع
        </a>

    </div>

</div>

<script>
const form = document.getElementById('loginPageForm');
const msg = document.getElementById('loginMsg');
const button = document.getElementById('loginSubmit');

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

form.addEventListener('submit', async e => {

    e.preventDefault();

    msg.innerHTML = '';

    const email =
        document.getElementById('loginEmail').value.trim();

    const password =
        document.getElementById('loginPassword').value;

    button.disabled = true;
    button.textContent = 'جاري الدخول...';

    try {

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        let data = {};

        try {
            data = await response.json();
        } catch (_) {}

        if (!response.ok || data.ok === false) {
            throw new Error(
                data.message || `HTTP ${response.status}`
            );
        }

        msg.innerHTML =
            '<div class="ok">تم تسجيل الدخول بنجاح ✅</div>';

        setTimeout(() => {
            window.location.href = '/';
        }, 500);

    } catch (error) {

        msg.innerHTML =
            `<div class="error">${escapeHtml(error.message)}</div>`;

        button.disabled = false;
        button.textContent = 'دخول';
    }

});
</script>

</body>
</html>
