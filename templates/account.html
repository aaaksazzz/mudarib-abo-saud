<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي</title><link rel="stylesheet" href="/static/app.css"></head><body><header class="top"><a class="brand" href="/">SMART TRADING <b>PRO</b></a><a href="/logout">خروج</a></header><main><h1>مرحباً {{user}}</h1><div class="stats-grid" id="stats"><div class="panel">إحصائيات الصفقات: جارٍ التحميل</div></div><h2>سجل الصفقات</h2><div id="trades" class="panel">لا توجد صفقات مسجلة بعد.</div><h2>التنبيهات</h2><div id="alerts" class="panel">لا توجد تنبيهات.</div></main><script>Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/trades').then(r=>r.json()),fetch('/api/alerts').then(r=>r.json())]).then(([s,t,a])=>{document.querySelector('#stats').innerHTML='<div class="panel"><small>الصفقات المغلقة</small><strong>'+s.total+'</strong></div><div class="panel"><small>نسبة الربح</small><strong>'+(s.win_rate===null?'—':s.win_rate+'%')+'</strong></div><div class="panel"><small>صافي العائد</small><strong>'+s.net_pct+'%</strong></div>';document.querySelector('#trades').textContent=t.length?t.map(x=>x.symbol+' · '+x.side+' · '+x.status).join(' | '):'لا توجد صفقات مسجلة بعد.';document.querySelector('#alerts').textContent=a.length?a.map(x=>x.symbol+' · '+x.direction).join(' | '):'لا توجد تنبيهات.'})</script></body></html>
