{% extends "base.html" %}

{% block content %}
<section id="subscription" class="section active">
<div class="section-head"><div><h2>الاشتراك 💳</h2><p>اختر الباقة المناسبة ثم أرسل بيانات التحويل للمراجعة.</p></div></div>
<div class="subscription-status" id="subscriptionStatus"></div>
<div class="plans" id="plans"></div>
<div class="payment-box" id="paymentBox" hidden>
<h3>طرق الدفع 💳</h3>
<div class="warning">⚠️ استخدم شبكة TRC20 فقط. اختيار شبكة خاطئة قد يؤدي لفقدان الأموال. تحقق من العنوان والمبلغ قبل التحويل.</div>
<div class="pay-grid">
<div><div class="qr" id="qrBox"></div></div>
<div>
<label>USDT عبر شبكة TRC20</label>
<div class="copy-row"><input id="payAddress" class="input" readonly><button class="btn primary" id="copyAddress">نسخ</button></div>
<label>Binance Pay ID</label>
<div class="copy-row"><input id="binancePayId" class="input" readonly><button class="btn primary" id="copyBinancePay">نسخ ID</button></div>
<div class="chosen-plan" id="chosenPlan"></div>
<label>TXID بعد التحويل</label>
<input id="txid" class="input" placeholder="ألصق رقم المعاملة هنا">
<button class="btn primary full" id="sendPayment">إرسال طلب الاشتراك</button>
<div id="paymentMsg"></div>
</div></div></div>
<div id="paymentHistory"></div>
</section>{% endblock %}
{% endblock %}
{% endblock %}
