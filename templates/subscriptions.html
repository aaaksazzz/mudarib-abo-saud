<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاشتراكات | المضارب PRO</title><link rel="stylesheet" href="/static/style.css?v=126"></head><body><header><a class="brand" href="/">المضارب <span>PRO</span></a><a class="icon" href="/">⌂</a></header><main class="page"><section class="hero"><small>SUBSCRIPTIONS</small><h1>💳 الاشتراكات</h1><p>اختر الباقة ثم ادفع عبر Binance Pay أو USDT TRC20.</p></section><div id="plans" class="cards-grid"></div><section class="card" id="pay" hidden><h2>طريقة الدفع</h2><p>حوّل المبلغ حسب الباقة المختارة ثم احتفظ بإثبات الدفع.</p><div id="payInfo"></div><p class="muted">بعد الدفع يتم اعتماد الاشتراك من الإدارة حتى يتم التحقق من العملية.</p></section></main><script>const $=s=>document.querySelector(s);async function load(){const d=await(await fetch("/api/subscription-plans",{cache:"no-store"})).json();const plans=d.plans||{};$("#plans").innerHTML=Object.entries(plans).map(([k,p])=>'<article class="card"><h2>'+p.name+'</h2><strong style="font-size:28px">'+p.price+'</strong><div style="margin-top:12px"><button class="btn primary" onclick="choose(\''+k+'\')">اختيار الباقة</button></div></article>').join("");window.pay=d}function choose(k){const d=window.pay, p=d.plans[k];$("#pay").hidden=false;$("#payInfo").innerHTML='<div class="card"><b>الباقة: '+p.name+' — '+p.price+'</b><hr><p><b>Binance Pay:</b> '+(d.binance_pay_id||"غير مضبوط حالياً")+'</p><p><b>USDT TRC20:</b> '+(d.usdt_trc20||"غير مضبوط حالياً")+'</p></div>';$("#pay").scrollIntoView({behavior:"smooth"})}load();</script></body></html>
