<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول — مضارب أبو سعود</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <section class="auth-card">

            <!-- الشعار -->
            <div class="auth-logo">

                <div class="logo-icon">₿</div>

                <div class="logo-text">
                    <strong>مضارب أبو سعود</strong>
                    <span>تحليل العملات الرقمية</span>
                </div>

            </div>


            <!-- العنوان -->
            <div class="auth-heading">

                <h1>تسجيل الدخول</h1>

                <p>
                    سجّل دخولك للوصول إلى حسابك وتحليلات السوق.
                </p>

            </div>


            <!-- رسالة الحالة -->
            <div
                id="loginMessage"
                class="auth-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>


            <!-- النموذج -->
            <form id="loginForm" novalidate>

                <div class="form-group">

                    <label for="loginEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        id="loginEmail"
                        name="email"
                        type="email"
                        class="form-input"
                        placeholder="example@email.com"
                        autocomplete="email"
                        inputmode="email"
                        maxlength="120"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        كلمة المرور
                    </label>

                    <div class="password-wrapper">

                        <input
                            id="loginPassword"
                            name="password"
                            type="password"
                            class="form-input"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            maxlength="200"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="إظهار كلمة المرور"
                            title="إظهار كلمة المرور"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    id="loginSubmitBtn"
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    🔐 تسجيل الدخول
                </button>

            </form>


            <!-- إنشاء حساب -->
            <div class="auth-divider">
                <span>أو</span>
            </div>


            <div class="auth-footer">

                <span>ما عندك حساب؟</span>

                <a href="/register">
                    إنشاء حساب جديد
                </a>

            </div>


            <!-- الرئيسية -->
            <div class="auth-back">

                <a href="/">
                    ← العودة للرئيسية
                </a>

            </div>

        </section>

    </main>


    <!-- Toast -->
    <div
        id="toastContainer"
        class="toast-container"
        aria-live="polite"
    ></div>


    <script>
        (() => {

            const form = document.getElementById("loginForm");
            const emailInput = document.getElementById("loginEmail");
            const passwordInput = document.getElementById("loginPassword");
            const message = document.getElementById("loginMessage");
            const submitButton = document.getElementById("loginSubmitBtn");
            const togglePassword = document.getElementById("togglePassword");


            /* ==========================================
               الرسائل
            ========================================== */

            function showMessage(text, type = "error") {

                message.textContent = text;

                message.className =
                    "auth-message " + type;

                message.hidden = false;

            }


            function hideMessage() {

                message.hidden = true;

                message.textContent = "";

                message.className = "auth-message";

            }


            /* ==========================================
               إظهار / إخفاء كلمة المرور
            ========================================== */

            togglePassword.addEventListener("click", () => {

                const isPassword =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPassword ? "text" : "password";

                togglePassword.textContent =
                    isPassword ? "🙈" : "👁️";

                togglePassword.setAttribute(
                    "aria-label",
                    isPassword
                        ? "إخفاء كلمة المرور"
                        : "إظهار كلمة المرور"
                );

                togglePassword.title =
                    isPassword
                        ? "إخفاء كلمة المرور"
                        : "إظهار كلمة المرور";

            });


            /* ==========================================
               تسجيل الدخول
            ========================================== */

            form.addEventListener("submit", async (event) => {

                event.preventDefault();

                hideMessage();


                const email =
                    emailInput.value.trim().toLowerCase();

                const password =
                    passwordInput.value;


                /* التحقق */

                if (!email) {

                    showMessage(
                        "فضلاً أدخل البريد الإلكتروني."
                    );

                    emailInput.focus();

                    return;
                }


                if (!email.includes("@")) {

                    showMessage(
                        "فضلاً أدخل بريدًا إلكترونيًا صحيحًا."
                    );

                    emailInput.focus();

                    return;
                }


                if (!password) {

                    showMessage(
                        "فضلاً أدخل كلمة المرور."
                    );

                    passwordInput.focus();

                    return;
                }


                /* حالة التحميل */

                submitButton.disabled = true;

                submitButton.dataset.originalText =
                    submitButton.textContent;

                submitButton.textContent =
                    "⏳ جاري تسجيل الدخول...";


                try {

                    const response = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            credentials: "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    let data = {};

                    try {
                        data = await response.json();
                    } catch (_) {
                        data = {};
                    }


                    /* فشل تسجيل الدخول */

                    if (
                        !response.ok ||
                        data.ok === false
                    ) {

                        showMessage(
                            data.message ||
                            data.error ||
                            "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                        );

                        return;
                    }


                    /* نجاح */

                    showMessage(
                        "تم تسجيل الدخول بنجاح ✓ جاري تحويلك...",
                        "success"
                    );


                    /*
                       ننتظر قليلًا حتى تظهر الرسالة
                    */

                    setTimeout(() => {

                        const params =
                            new URLSearchParams(
                                window.location.search
                            );

                        const next =
                            params.get("next");


                        /*
                           السماح فقط بالمسارات الداخلية
                           لمنع التحويل إلى مواقع خارجية.
                        */

                        if (
                            next &&
                            next.startsWith("/") &&
                            !next.startsWith("//")
                        ) {

                            window.location.href = next;

                        } else {

                            window.location.href = "/";

                        }

                    }, 500);

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        "تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت وحاول مرة أخرى."
                    );

                } finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        submitButton.dataset.originalText ||
                        "🔐 تسجيل الدخول";

                }

            });


            /* ==========================================
               Enter
            ========================================== */

            emailInput.addEventListener(
                "keydown",
                (event) => {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        passwordInput.focus();

                    }

                }
            );


            /* ==========================================
               تنظيف الرسالة عند الكتابة
            ========================================== */

            emailInput.addEventListener(
                "input",
                () => {

                    if (!message.hidden) {
                        hideMessage();
                    }

                }
            );


            passwordInput.addEventListener(
                "input",
                () => {

                    if (!message.hidden) {
                        hideMessage();
                    }

                }
            );


            /* ==========================================
               إذا المستخدم مسجل دخول أصلًا
            ========================================== */

            fetch(
                "/api/auth/me",
                {
                    method: "GET",
                    credentials: "same-origin",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            )
            .then(response => {

                if (!response.ok) {
                    return null;
                }

                return response.json();

            })
            .then(data => {

                if (
                    data &&
                    data.ok &&
                    data.user
                ) {

                    showMessage(
                        "أنت مسجل الدخول بالفعل. جاري تحويلك...",
                        "success"
                    );

                    setTimeout(() => {

                        window.location.href = "/";

                    }, 500);

                }

            })
            .catch(() => {
                /* تجاهل الخطأ هنا */
            });

        })();
    </script>

</body>

</html>
