{% extends "base.html" %}

{% block content %}
<section id="forex" class="section">

  <div class="section-head">

    <div>

      <h2>
        💱 الفوركس
      </h2>

      <p>
        تحليل أزواج العملات العالمية.
      </p>

    </div>

    <button
      class="btn primary"
      id="refreshForex"
    >
      🔄 تحديث
    </button>

  </div>


  <div
    class="scanner-note"
    id="forexStatus"
  >
    جاهز للفحص
  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>الزوج</th>
          <th>السعر</th>
          <th>الإشارة</th>
          <th>القوة</th>
          <th>RSI</th>
          <th>الدخول</th>
          <th>الهدف</th>
          <th>الوقف</th>

        </tr>

      </thead>

      <tbody id="forexBody"></tbody>

    </table>

  </div>

</section>{% endblock %}
{% endblock %}
{% endblock %}
