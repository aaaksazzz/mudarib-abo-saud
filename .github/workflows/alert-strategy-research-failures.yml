name: Auto-recover and report strategy research failures

on:
  workflow_run:
    workflows:
      - Search Binance Spot strategies 15m
    types:
      - completed

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  retry-transient-failure:
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Automatically retry failed research once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Attempting one automatic recovery retry for $RUN_URL"
          gh run rerun "$RUN_ID" --failed --repo "$GH_REPO"

  report-persistent-failure:
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.run_attempt >= 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update failure report after retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          title="Strategy research failed — run $RUN_ID"
          body="$(cat <<EOF
          ## Strategy research failed after automatic retry

          - Workflow: $RUN_NAME
          - Status: $RUN_CONCLUSION
          - Run: $RUN_URL
          - Commit: $RUN_SHA
          - Automatic retry: exhausted (one retry attempted)

          Inspect the failed job logs and fix the underlying code/configuration problem. This alert is not a strategy result. A workflow cannot safely invent and apply arbitrary code fixes without diagnosis and validation.
          EOF
          )"
          existing=$(gh issue list --repo "$GH_REPO" --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi
