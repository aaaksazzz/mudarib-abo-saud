name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app.py research_engine.py tests
      - name: Check JavaScript syntax
        run: node --check static/app.js && node --check static/auth.js && node --check static/admin-control.js
      - name: Run regression smoke tests
        run: python -m unittest discover -s tests -v
