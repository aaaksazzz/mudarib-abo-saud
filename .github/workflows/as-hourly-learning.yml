name: AS daily continuous learning

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: as-daily-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent AS memory
        uses: actions/cache/restore@v4
        with:
          path: data/as_learning/as_memory.sqlite3
          key: as-memory-v1-${{ github.run_id }}
          restore-keys: |
            as-memory-v1-

      - name: Run daily memory and learning cycle
        run: python scripts/as_continuous_learning.py

      - name: Persist memory cache
        uses: actions/cache/save@v4
        with:
          path: data/as_learning/as_memory.sqlite3
          key: as-memory-v1-${{ github.run_id }}

      - name: Publish daily learning report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/as_learning/latest_report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(as): publish daily learning report"
            git push
          else
            echo "No report changes to publish"
          fi
