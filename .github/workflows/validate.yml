name: Validate SMART TRADING PRO
on:
  push:
    branches: [rebuild/smart-trading-pro-v2]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py market_engine.py
      - run: python -m unittest discover -s tests -v
