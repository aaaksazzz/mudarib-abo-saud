name: Platform CI
on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript
        run: node --check platform.js
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app.py quant_engine.py market_adapters.py market_strategies.py dive_engine
      - name: Run backend regression tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          COOKIE_SECURE: "false"
          ENABLE_AUTO_SCAN: "false"
          DATABASE_URL: sqlite:///ci-market-tests.db
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from app import app
          client = app.test_client()
          for path in ("/health", "/ready", "/api/bootstrap", "/", "/plans", "/journal", "/blog", "/news", "/login", "/register", "/account", "/admin", "/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex", "/styles.css", "/pro-theme.css", "/compat.css", "/platform.js"):
              response = client.get(path)
              assert response.status_code in (200, 503), (path, response.status_code, response.data[:300])
          assert client.get("/health").get_json()["ok"] is True
          assert client.get("/api/bootstrap").status_code == 200
          for path in ("/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex"):
              page = client.get(path)
              assert page.status_code == 200 and b'src="/platform.js?' in page.data, (path, page.status_code)
          assert client.get("/compat.css").status_code == 200
          print("route and static asset smoke tests passed")
          PY
