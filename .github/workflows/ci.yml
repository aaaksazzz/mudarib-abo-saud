name: Platform CI
on:
  push:
    branches: [main, "rebuild/**", "upgrade-runtime-**", "ai-market-analyst-v1"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser JavaScript
        run: |
          node --check platform.js
          node --check intelligence.js
          node --check ai-analyst.js
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Report runtime versions
        run: |
          python --version
          node --version
          python -m pip freeze
      - name: Compile backend
        run: python -m compileall -q app.py market_adapters.py breakout_50_strategy.py us_day_trader_strategy.py ai_market_analyst.py stp_entry.py
      - name: Run backend regression tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          COOKIE_SECURE: "false"
          ENABLE_AUTO_SCAN: "false"
          DATABASE_URL: sqlite:///ci-market-tests.db
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from app import app, scheduler
          from stp_entry import app as entry_app
          from breakout_50_strategy import diagnostic_self_test as breakout_50_diagnostic_self_test
          from us_day_trader_strategy import diagnostic_self_test as us_day_trader_diagnostic_self_test
          assert breakout_50_diagnostic_self_test()["ok"], breakout_50_diagnostic_self_test()
          assert us_day_trader_diagnostic_self_test()["ok"], us_day_trader_diagnostic_self_test()
          assert scheduler is None, "ENABLE_AUTO_SCAN=false must disable background jobs in CI"
          client = app.test_client()
          for path in ("/health", "/ready", "/api/bootstrap", "/api/trades", "/api/strategy/status", "/api/strategy-status", "/", "/plans", "/journal", "/blog", "/news", "/login", "/register", "/account", "/admin", "/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex", "/styles.css", "/pro-theme.css", "/compat.css", "/platform.js", "/intelligence", "/intelligence.js", "/intelligence.css", "/ai-analyst", "/ai-analyst.js", "/ai-analyst.css", "/api/ai-analyst/status"):
            response = client.get(path)
            assert response.status_code in (200, 503), (path, response.status_code, response.data[:300])
          assert client.get("/health").get_json()["ok"] is True
          assert client.get("/api/bootstrap").status_code == 200
          assert client.get("/api/trades").status_code == 200
          strategy_status = client.get("/api/strategy/status").get_json()
          assert strategy_status["strategy_fingerprint"].startswith("STP-BREAKOUT-50-VOLUME-PROFILE-INVERSE-V2-"), strategy_status
          assert strategy_status["engine"] == "MARKET-SPECIFIC STRATEGY ENGINES"
          assert strategy_status["us_day_trader"]["ready"] is True
          assert strategy_status["strategy_ready"] is True
          assert strategy_status["manual_only"] is True
          status_summary = client.get("/api/strategy-status").get_json()
          assert status_summary["strategy_fingerprint"].startswith("STP-BREAKOUT-50-VOLUME-PROFILE-INVERSE-V2-"), status_summary
          assert status_summary["strategy_ready"] is True
          assert status_summary["legacy_removed"] is True, status_summary
          assert status_summary["manual_only"] is True
          assert client.get("/api/strategy/smart-money?market=spot").status_code == 200
          us_status = client.get("/api/strategy/breakout-50?market=us-stocks").get_json()
          assert us_status["fingerprint"].startswith("STP-US-DAY-TRADER-MULTI-SETUP-V1-"), us_status
          assert us_status["engine"] == "STP US DAY TRADER MULTI-SETUP"
          assert client.get("/api/strategy/status").get_json()["manual_only"] is True
          home = client.get("/")
          assert home.status_code == 200 and b'SMART TRADING PRO' in home.data and b'/platform.js?' in home.data, ("/", home.status_code, home.data[:300])
          for path in ("/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex"):
            page = client.get(path)
            assert page.status_code == 200 and b'SMART TRADING PRO' in page.data, (path, page.status_code, page.data[:300])
            assert b'id="timeframeFilters"' in page.data and b'/intelligence.js?' in page.data and b'/intelligence.css?' in page.data, (path, "dedicated timeframe terminal missing")
          assert client.get("/compat.css").status_code == 200
          print("route and static asset smoke tests passed")
          PY
