name: Platform CI
on:
  push:
    branches: [main, "rebuild/**", "upgrade-runtime-**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check browser JavaScript
        run: |
          node --check platform.js
          node --check intelligence.js
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Report runtime versions
        run: |
          python --version
          node --version
          python -m pip freeze
      - name: Compile backend
        run: python -m compileall -q app.py market_adapters.py market_strategies.py
      - name: Run backend regression tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          COOKIE_SECURE: "false"
          ENABLE_AUTO_SCAN: "false"
          ENABLE_DAILY_BLOG_PUBLISH: "false"
          DATABASE_URL: sqlite:///ci-market-tests.db
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from app import app, scheduler
          from market_strategies import diagnostic_self_test
          assert scheduler is None, "ENABLE_AUTO_SCAN=false must disable background jobs in CI"
          assert diagnostic_self_test()["ok"], diagnostic_self_test()
          client = app.test_client()
          for path in ("/health", "/ready", "/api/bootstrap", "/api/trades", "/api/strategy/status", "/api/strategy-status", "/", "/plans", "/journal", "/blog", "/news", "/login", "/register", "/account", "/admin", "/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex", "/sitemap.xml", "/robots.txt", "/blog?lang=en", "/styles.css", "/pro-theme.css", "/compat.css", "/platform.js", "/intelligence", "/intelligence.js", "/intelligence.css"):
            response = client.get(path)
            assert response.status_code in (200, 503), (path, response.status_code, response.data[:300])
          assert client.get("/health").get_json()["ok"] is True
          assert client.get("/api/bootstrap").status_code == 200
          assert client.get("/api/visitors/stats").get_json()["ok"] is True
          assert client.get("/sitemap.xml").status_code == 200
          for lang in ("ar", "en", "es", "de", "id", "pt", "tr", "fr", "hi"):
              blog = client.get(f"/api/content/blog?lang={lang}").get_json()
              assert len(blog["items"]) >= 2, (lang, blog)
          assert client.get("/blog/risk-ar").status_code == 200
          assert client.get("/api/trades").status_code == 200
          strategy_status = client.get("/api/strategy/status").get_json()
          assert strategy_status["strategy_fingerprint"].startswith("SMART-REGIME-ADAPTIVE-"), strategy_status
          assert strategy_status["engine"] == "SMART TRADING PRO"
          assert strategy_status["strategy_ready"] is True
          assert strategy_status["manual_only"] is True
          assert client.get("/api/strategy/status").get_json()["manual_only"] is True
          for path in ("/", "/market/spot", "/market/futures", "/market/alpha", "/market/us-stocks", "/market/us-contracts", "/market/saudi", "/market/forex"):
            page = client.get(path)
            assert page.status_code == 200 and b'SMART TRADING PRO' in page.data and b'/platform.js?' in page.data, (path, page.status_code, page.data[:300])
            assert b'/intelligence?market=' not in page.data, (path, "legacy market redirect remains")
          assert client.get("/compat.css").status_code == 200
          print("route and static asset smoke tests passed")
          PY
