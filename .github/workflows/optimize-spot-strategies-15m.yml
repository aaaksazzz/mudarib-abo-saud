name: Search Binance Spot strategies 15m
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - research/liquidity-sweep-optimizer
    paths:
      - "scripts/optimize_spot_strategies_15m.py"
      - ".github/workflows/optimize-spot-strategies-15m.yml"
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover and test rules on Binance Spot USDT pairs
        run: python scripts/optimize_spot_strategies_15m.py
      - name: Publish validated strategy immediately
        if: success() && hashFiles('backtest-results/spot-strategy-search-15m.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=$(python -c 'import json; print(json.load(open("backtest-results/spot-strategy-search-15m.json")).get("best_candidate",{}).get("status",""))')
          if [ "$status" != "candidate_for_further_validation" ]; then
            echo "No validated strategy yet; no notification sent."
            exit 0
          fi
          python - <<'PY' > /tmp/spot-winner.md
          import json
          p=json.load(open("backtest-results/spot-strategy-search-15m.json",encoding="utf-8"))
          b=p.get("best_candidate",{})
          if b.get("status") != "candidate_for_further_validation":
              raise SystemExit("No validated candidate; do not publish a winner.")
          r=b.get("rule",{}); v=b.get("validation",{})
          print("## Strategy found — further forward validation required")
          print("- Market: Binance Spot USDT")
          print("- Timeframe: 15m")
          print(f"- Rule: {json.dumps(r,ensure_ascii=False)}")
          for k in ("trades","win_rate_pct","avg_trade_net_pct","mean_symbol_profit_factor","mean_symbol_drawdown_pct","profitable_symbols_pct","mean_symbol_return_pct"):
              print(f"- {k}: {v.get(k, 'n/a')}")
          print(f"- Completed UTC: {p.get('completed_utc', 'unknown')}")
          print("\\nPaper backtest only. This is not proof of future profitability; forward-test before live trading.")
          PY
          title="Spot strategy candidate — 15m validation"
          existing=$(gh issue list --state open --search 'Spot strategy candidate — 15m validation' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/spot-winner.md
          else
            gh issue create --title "$title" --body-file /tmp/spot-winner.md
          fi
      - name: Upload spot research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-strategy-search-15m-results
          path: backtest-results/spot-strategy-search-15m.json
          if-no-files-found: warn
          retention-days: 14
