name: BTCUSDT Futures 1m SMA20 Contrarian Backtest 180d
on:
  push:
    paths:
      - "scripts/backtest_btcusdt_futures_1m_sma20.py"
      - "scripts/backtest_btcusdt_futures_1m_reversed_180d.py"
      - ".github/workflows/backtest-btcusdt-sma20-180d.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 180-day BTCUSDT futures 1m SMA20 backtest
        run: python scripts/backtest_btcusdt_futures_1m_sma20.py
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-futures-1m-sma20-180d
          path: backtest-results/btcusdt-futures-1m-sma20-contrarian-180d.json
          if-no-files-found: warn
          retention-days: 30
