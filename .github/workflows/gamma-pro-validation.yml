name: GAMMA PRO validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py gamma_engine.py gammaflip_client.py
      - name: Check frontend syntax
        run: node --check static/app.js
      - name: Run tests
        run: pytest -q
