name: Mathematical Statistics Strategy Backtest
on:
  push:
    paths:
      - "scripts/backtest_math_stats_15m.py"
      - ".github/workflows/backtest-math-stats.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 30-day 15m statistical backtest
        run: python scripts/backtest_math_stats_15m.py
      - name: Upload mathematical backtest results
        uses: actions/upload-artifact@v4
        with:
          name: math-stats-15m-backtest-results
          path: backtest-results/math-stats-15m.json
          if-no-files-found: error
          retention-days: 14
