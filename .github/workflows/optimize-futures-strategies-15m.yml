name: Search Binance Futures strategies 15m
on:
  workflow_dispatch:
  push:
    branches:
      - research/liquidity-sweep-optimizer
    paths:
      - "scripts/optimize_futures_strategies_15m.py"
      - "scripts/futures_universe_snapshot.json"
      - ".github/workflows/optimize-futures-strategies-15m.yml"
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search strategies on Binance USDⓈ-M perpetual futures
        run: python scripts/optimize_futures_strategies_15m.py
      - name: Upload paper research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-strategy-search-15m-results
          path: backtest-results/futures-strategy-search-15m.json
          if-no-files-found: warn
          retention-days: 14
