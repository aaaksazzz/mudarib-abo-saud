name: Standalone Futures Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window in days"
        required: true
        default: "180"
        type: string
      fee_bps:
        description: "Trading fee in basis points per side"
        required: true
        default: "5"
        type: string
      slippage_bps:
        description: "Slippage in basis points per side"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: pip install -r research/standalone_futures_backtest/requirements.txt
      - name: Fetch Binance data and run independent backtest
        env:
          DAYS: ${{ inputs.days }}
          FEE_BPS: ${{ inputs.fee_bps }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
        run: python research/standalone_futures_backtest/backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-futures-backtest-results
          path: research/standalone_futures_backtest/results/
          if-no-files-found: warn
          retention-days: 30
