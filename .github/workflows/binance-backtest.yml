name: Binance Futures Historical Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/backtest_binance_futures.py"
      - ".github/workflows/binance-backtest.yml"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 30-day backtest
        run: python scripts/backtest_binance_futures.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-futures-backtest-results
          path: backtest-results/latest.json
          if-no-files-found: warn
          retention-days: 14
