name: V2 isolated checks

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  push:
    branches: ["rebuild/platform-v2"]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: v2/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: v2/frontend/package.json
      - run: npm install
      - run: npm run build
