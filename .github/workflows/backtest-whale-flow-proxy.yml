name: Whale Flow Proxy Strategy Backtest
on:
  push:
    paths:
      - "scripts/backtest_whale_flow_proxy_15m.py"
      - ".github/workflows/backtest-whale-flow-proxy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 30-day spot and futures comparison
        run: python scripts/backtest_whale_flow_proxy_15m.py
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-flow-proxy-15m-30d
          path: backtest-results/whale-flow-proxy-15m.json
          if-no-files-found: warn
          retention-days: 14
