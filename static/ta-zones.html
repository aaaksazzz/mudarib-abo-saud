<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحلل الذكي — Live Chart</title>
<style>
:root{--bg:#060a10;--panel:#0b1119;--line:#1b2836;--txt:#e9f0f7;--muted:#7e8da0;--up:#20d99a;--dn:#ff5570;--blue:#55c7ff;--gold:#f5c451;--purple:#b58cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#10202d 0,#060a10 45%);color:var(--txt);font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.title{font-size:18px;font-weight:800}.live{font-size:12px;color:var(--up)}.sub{color:var(--muted);font-size:11px;margin-top:4px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px}.card{background:linear-gradient(180deg,#0c131c,#080d14);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 35px #0005}.toolbar{display:flex;gap:6px;padding:9px;border-bottom:1px solid var(--line);overflow:auto}.toolbar button{border:1px solid #263544;background:#101923;color:#b9c6d4;border-radius:8px;padding:7px 11px;white-space:nowrap}.toolbar button.active{background:#dcefe8;color:#06120d;border-color:#dcefe8}.chart{height:650px;position:relative}.chart canvas{display:block;width:100%;height:100%;touch-action:none}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);color:#93a1b1;font-size:11px}.side{padding:12px}.side h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;background:#0e161f;border:1px solid #172432;border-radius:9px;padding:9px;margin:6px 0;font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}.ai{font-size:20px}.find{padding:8px 2px;border-bottom:1px solid #17222e;font-size:12px}.hint{color:var(--muted);font-size:10px;line-height:1.7;margin-top:12px}.tf{display:flex;gap:5px;flex-wrap:wrap}.small{font-size:10px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.chart{height:520px}.side{display:grid;grid-template-columns:1fr 1fr;gap:6px}.side h3,.hint,#findingsTitle{grid-column:1/-1}.row{margin:0}.find{grid-column:1/-1}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="title" id="title">المحلل الذكي · BTCUSDT</div><div class="sub">تحليل تلقائي يُرسم مباشرة داخل الشارت</div></div><div class="live" id="live">● LIVE</div></div>
<div class="grid">
<section class="card"><div class="toolbar"><div class="tf">
<button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button>
</div></div><div class="chart"><canvas id="cv"></canvas></div>
<div class="legend">🟦 FVG &nbsp; 🟨 Order Block &nbsp; 🟪 Liquidity &nbsp; 🟢 Entry/TP &nbsp; 🔴 SL &nbsp; ⚡ BOS/CHOCH</div></section>
<aside class="card side"><h3>نتيجة التحليل</h3>
<div class="row"><span>الاتجاه</span><b id="trend">—</b></div><div class="row"><span>Structure</span><b id="struct">—</b></div><div class="row"><span>AI</span><b class="ai" id="ai">—</b></div>
<div id="levels"></div><div id="findingsTitle"><b>التحليل المكتشف</b></div><div id="findings"></div>
<div class="hint">المناطق والخطوط تُحسب من الشموع الحالية وتُعاد مع تحديث السوق. الأهداف والوقف تُرسم على السعر نفسه.</div></aside>
</div></div>
<script>
const qs=new URLSearchParams(location.search);
let symbol=(qs.get("symbol")||"BTCUSDT").toUpperCase(),market=qs.get("market")||"spot",tf=qs.get("tf")||"15m";
let entry=+qs.get("entry")||null,tp1=+qs.get("tp1")||null,tp2=+qs.get("tp2")||null,tp3=+qs.get("tp3")||null,sl=+qs.get("sl")||null,ai0=+qs.get("ai")||null,data=[];
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"); let analysis={};
const C={up:"#20d99a",dn:"#ff5570",blue:"#55c7ff",gold:"#f5c451",purple:"#b58cff",grid:"#17232e",muted:"#718094"};
function fmt(v){return Number.isFinite(+v)?(+v).toLocaleString("en-US",{maximumFractionDigits:8}):"—"}
function resize(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function endpoint(){return (market==="futures"?"https://fapi.binance.com/fapi/v1/klines":"https://api.binance.com/api/v3/klines")+"?symbol="+encodeURIComponent(symbol)+"&interval="+tf+"&limit=180"}
function calc(a){
 const hi=[],lo=[]; for(let i=2;i<a.length-2;i++){if(a[i].h>a[i-1].h&&a[i].h>a[i+1].h&&a[i].h>a[i-2].h&&a[i].h>a[i+2].h)hi.push(i);if(a[i].l<a[i-1].l&&a[i].l<a[i+1].l&&a[i].l<a[i-2].l&&a[i].l<a[i+2].l)lo.push(i)}
 const last=a[a.length-1],base=a[Math.max(0,a.length-30)],trend=last.c>=base.c?"up":"dn";
 const levels={liqH:hi.length?a[hi[hi.length-1]].h:null,liqL:lo.length?a[lo[lo.length-1]].l:null}; const rangeH=Math.max(...a.slice(-60).map(x=>x.h)),rangeL=Math.min(...a.slice(-60).map(x=>x.l)),mid=(rangeH+rangeL)/2;
 const fvg=[];for(let i=2;i<a.length;i++){if(a[i-2].h<a[i].l)fvg.push({from:a[i-2].h,to:a[i].l,up:true,i});if(a[i-2].l>a[i].h)fvg.push({from:a[i].h,to:a[i-2].l,up:false,i})}
 const obs=[];for(let i=Math.max(2,a.length-35);i<a.length-1;i++){let x=a[i],n=a[i+1];if(x.c<x.o&&n.c>x.h)obs.push({lo:x.l,hi:x.h,up:true,i});if(x.c>x.o&&n.c<x.l)obs.push({lo:x.l,hi:x.h,up:false,i})}
 let bos="—";if(last.c>(levels.liqH||Infinity))bos="BOS صاعد";else if(last.c<(levels.liqL||-Infinity))bos="BOS هابط";else if(trend==="up")bos="صاعد";else bos="هابط";
 const av=a.slice(-20).reduce((s,x)=>s+x.v,0)/20,vol=last.v>av*1.5;
 let score=ai0||68;if(vol)score+=5;if(fvg.length)score+=4;if(bos.includes("BOS"))score+=7;score=Math.max(50,Math.min(97,score));
 analysis={hi,lo,fvg:fvg.slice(-5),obs:obs.slice(-4),levels,bos,trend,score,vol,rangeH,rangeL,mid};
}
function priceMap(a){
 let w=cv.clientWidth,h=cv.clientHeight,lo=Math.min(...a.map(x=>x.l)),hi=Math.max(...a.map(x=>x.h)),pad=(hi-lo)*.09||1;lo-=pad;hi+=pad;
 return {w,h,lo,hi,x:i=>i*(w-65)/(a.length-1),y:p=>h-((p-lo)/(hi-lo))*h*.88-8};
}
function line(y,col,dash=[7,5],label=""){ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.clientWidth-65,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font="11px Arial";if(label)ctx.fillText(label,7,y-5);ctx.restore()}
function zone(x1,x2,y1,y2,col,label){ctx.save();ctx.fillStyle=col+"18";ctx.strokeStyle=col+"80";ctx.fillRect(x1,Math.min(y1,y2),x2-x1,Math.abs(y2-y1));ctx.strokeRect(x1,Math.min(y1,y2),x2-x1,Math.abs(y2-y1));ctx.fillStyle=col;ctx.font="10px Arial";ctx.fillText(label,x1+5,Math.min(y1,y2)+13);ctx.restore()}
function draw(){
 if(!data.length)return;let a=data.map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})),m=priceMap(a),w=m.w,h=m.h;
 ctx.clearRect(0,0,w,h);ctx.fillStyle="#080e15";ctx.fillRect(0,0,w,h);
 for(let i=0;i<6;i++){let yy=12+i*h*.15;ctx.strokeStyle=C.grid;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w-65,yy);ctx.stroke()}
 ctx.font="10px Arial";
 for(let i=0;i<5;i++){let p=m.lo+(m.hi-m.lo)*i/4,yy=m.y(p);ctx.fillStyle=C.muted;ctx.fillText(fmt(p),w-58,yy-3)}
 const step=(w-65)/a.length,bw=Math.max(2,step*.58);
 // premium / discount
 ctx.save(); ctx.fillStyle="#b58cff10"; ctx.fillRect(0,m.y(analysis.rangeH),w-65,m.y(analysis.mid)-m.y(analysis.rangeH)); ctx.fillStyle="#20d99a10"; ctx.fillRect(0,m.y(analysis.mid),w-65,m.y(analysis.rangeL)-m.y(analysis.mid)); ctx.fillStyle="#b58cff"; ctx.font="10px Arial"; ctx.fillText("PREMIUM",8,m.y(analysis.rangeH)+14); ctx.fillStyle="#20d99a"; ctx.fillText("DISCOUNT",8,m.y(analysis.rangeL)-8); line(m.y(analysis.mid),"#778899",[2,6],"50%"); ctx.restore();
 // analysis overlays first
 analysis.fvg.forEach(z=>{let x1=Math.max(0,m.x(Math.max(0,z.i-18))),x2=Math.min(w-65,m.x(Math.min(a.length-1,z.i+12)));zone(x1,x2,m.y(z.from),m.y(z.to),C.blue,"FVG")});
 analysis.obs.forEach(z=>{let x1=Math.max(0,m.x(Math.max(0,z.i-12))),x2=Math.min(w-65,m.x(Math.min(a.length-1,z.i+18)));zone(x1,x2,m.y(z.lo),m.y(z.hi),C.gold,"OB")});
 if(analysis.levels.liqH)line(m.y(analysis.levels.liqH),C.purple,[3,6],"Liquidity High");
 if(analysis.levels.liqL)line(m.y(analysis.levels.liqL),C.purple,[3,6],"Liquidity Low");
 // candles
 a.forEach((c,i)=>{let x=m.x(i),up=c.c>=c.o;ctx.strokeStyle=up?C.up:C.dn;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,m.y(c.h));ctx.lineTo(x,m.y(c.l));ctx.stroke();let top=m.y(Math.max(c.o,c.c)),bot=m.y(Math.min(c.o,c.c));ctx.fillRect(x-bw/2,top,bw,Math.max(1,bot-top))});
 // HH HL LH LL + BOS / CHOCH / MSS
 if(analysis.bos!=="—"){let i=a.length-1,x=m.x(i),yy=m.y(a[i].c);ctx.fillStyle=analysis.trend==="up"?C.up:C.dn;ctx.font="bold 11px Arial";ctx.fillText(analysis.bos,x-35,yy-14);ctx.beginPath();ctx.arc(x,yy,4,0,Math.PI*2);ctx.fill()}
 // trade levels
 [[entry,"ENTRY",C.blue],[tp1,"TP1",C.up],[tp2,"TP2",C.up],[tp3,"TP3",C.up],[sl,"SL",C.dn]].forEach(z=>{if(Number.isFinite(z[0]))line(m.y(z[0]),z[2],[8,5],z[1]+" "+fmt(z[0]))});
}
function panel(){
 document.getElementById("trend").textContent=analysis.trend==="up"?"صاعد":"هابط";document.getElementById("trend").className=analysis.trend==="up"?"up":"dn";
 document.getElementById("struct").textContent=analysis.bos;document.getElementById("struct").className=analysis.bos.includes("صاعد")?"up":"dn";
 document.getElementById("ai").textContent=analysis.score+"%";
 let lv=[["الدخول",entry],["TP1",tp1],["TP2",tp2],["TP3",tp3],["SL",sl]];
 document.getElementById("levels").innerHTML=lv.filter(x=>Number.isFinite(x[1])).map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+fmt(x[1])+'</b></div>').join("");
 let f=[];if(analysis.bos!=="—")f.push("⚡ "+analysis.bos);if(analysis.fvg.length)f.push("🟦 FVG: "+analysis.fvg.length+" منطقة");if(analysis.obs.length)f.push("🟨 Order Block: "+analysis.obs.length);if(analysis.levels.liqH||analysis.levels.liqL)f.push("🟪 Liquidity: مستويات مكتشفة"); f.push("◐ Premium / Discount: "+(analysis.trend==="up"?"منطقة خصم للبحث عن شراء":"منطقة بريميوم للبحث عن بيع"));if(analysis.vol)f.push("📊 Volume: مرتفع");document.getElementById("findings").innerHTML=f.map(x=>'<div class="find">'+x+'</div>').join("")||'<div class="find">لا توجد بنية قوية حالياً</div>';
}
async function load(){try{let r=await fetch(endpoint(),{cache:"no-store"});if(!r.ok)throw Error();data=await r.json();calc(data.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})));draw();panel();document.getElementById("title").textContent="المحلل الذكي · "+symbol+" · "+tf;document.getElementById("live").textContent="● LIVE · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});}catch(e){document.getElementById("live").textContent="● تعذر جلب البيانات";}}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("active",x===b));load()});
window.addEventListener("resize",resize);window.addEventListener("load",resize);load();setInterval(load,15000);
</script></body></html>
