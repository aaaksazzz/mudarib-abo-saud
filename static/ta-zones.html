<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحلل الذكي — تحليلات العملات الرقمية</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#edf2f7;font-family:Arial,sans-serif;padding:8px}.wrap{max-width:430px;margin:auto}.top{padding:12px 4px;text-align:center}.brand{font-size:22px;font-weight:900}.desc{font-size:11px;color:#758194;margin-top:5px}.tabs{display:flex;gap:5px;overflow:auto;padding:8px 0}.tabs button{border:1px solid #293241;background:#111720;color:#aeb8c5;border-radius:9px;padding:8px 12px;white-space:nowrap;font-weight:700}.tabs button.active{background:#edf5f0;color:#07100d}.coin{background:#10151d;border:1px solid #252e3b;border-radius:16px;overflow:hidden;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #202733}.name{font-size:18px;font-weight:900}.sub{font-size:10px;color:#748092;margin-top:3px}.live{font-size:10px;color:#25d69b}.cw{position:relative}.chart{height:270px}.tools{position:absolute;z-index:5;top:9px;right:9px;display:flex;gap:4px;background:#0b1017dd;border:1px solid #293241;border-radius:9px;padding:4px}.tools button{width:34px;height:30px;border:1px solid #354050;background:#151b24;color:#eef2f7;border-radius:6px;font-size:16px;font-weight:900}.analysis{padding:10px}.pattern{font-size:13px;font-weight:900;margin-bottom:8px}.signal{font-size:20px;font-weight:900;margin-bottom:9px}.green{color:#25d69b}.red{color:#ff5b72}.gray{color:#aeb8c5}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.lv{background:#0b1017;border:1px solid #27313e;border-radius:8px;padding:7px 3px;text-align:center;color:#7f8b9b;font-size:9px}.lv b{display:block;color:#eef2f7;font-size:10px;margin-top:4px}.reason{font-size:10px;color:#8a95a5;margin-top:8px;line-height:1.6}.badge{display:inline-block;border:1px solid #303a49;background:#151b24;border-radius:7px;padding:4px 7px;margin-left:4px;color:#aeb8c5}.empty{padding:30px;text-align:center;color:#778395}
@media(max-width:700px){.chart{height:255px}.levels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">المحلل الذكي</div><div class="desc">تحليلات سعرية مرسومة داخل الشارت — بدون مؤشرات</div></div>
<div class="tabs" id="tabs">
<button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button>
</div>
<div id="feed"></div>
</main>
<script>
const COINS=[["BTCUSDT","₿","بيتكوين"],["ETHUSDT","Ξ","إيثريوم"],["XRPUSDT","✕","XRP"],["BNBUSDT","◆","BNB"],["SOLUSDT","◎","سولانا"]];
const TF={5m:"5m",15m:"15m",1h:"1h",4h:"4h",1d:"1d",1w:"1w",1M:"1M"};
const feed=document.getElementById("feed");let tf="15m";
const fmt=v=>Number(v).toLocaleString("en-US",{maximumFractionDigits:8});
function pivots(a){
 const hi=[],lo=[];
 for(let i=3;i<a.length-3;i++){
  if(a[i].high>a[i-1].high&&a[i].high>a[i-2].high&&a[i].high>a[i-3].high&&a[i].high>a[i+1].high&&a[i].high>a[i+2].high&&a[i].high>a[i+3].high)hi.push(i);
  if(a[i].low<a[i-1].low&&a[i].low<a[i-2].low&&a[i].low<a[i-3].low&&a[i].low<a[i+1].low&&a[i].low<a[i+2].low&&a[i].low<a[i+3].low)lo.push(i);
 }
 return {hi,lo};
}
function analyze(a){
 const p=pivots(a),z=a[a.length-1],h=p.hi.slice(-5),l=p.lo.slice(-5);
 const highs=h.map(i=>a[i].high),lows=l.map(i=>a[i].low);
 let pattern="حركة سعرية",side="حيادي",reason="انتظار تأكيد سعري";
 if(h.length>=3){
  const [x,y,w]=highs.slice(-3);
  if(w<y&&Math.abs(x-w)/y<.018) pattern="رأس وكتفين محتمل";
 }
 if(l.length>=3){
  const [x,y,w]=lows.slice(-3);
  if(w>y&&Math.abs(x-w)/y<.018) pattern="رأس وكتفين مقلوب محتمل";
 }
 if(h.length>=2&&l.length>=2){
  const up=highs.at(-1)>highs.at(-2)&&lows.at(-1)>lows.at(-2);
  const down=highs.at(-1)<highs.at(-2)&&lows.at(-1)<lows.at(-2);
  if(up){side="شراء";pattern=pattern==="حركة سعرية"?"اتجاه صاعد + قمم وقيعان صاعدة":pattern;reason="السعر يحافظ على هيكل صاعد ويقترب من تأكيد الاختراق."}
  else if(down){side="بيع";pattern=pattern==="حركة سعرية"?"اتجاه هابط + قمم وقيعان هابطة":pattern;reason="السعر يحافظ على هيكل هابط ويقترب من تأكيد الكسر."}
 }
 const resistance=h.length?a[h.at(-1)].high:z.close*1.01;
 const support=l.length?a[l.at(-1)].low:z.close*.99;
 if(side==="حيادي"){side=z.close>=(support+resistance)/2?"شراء":"بيع";reason="السعر داخل نطاق؛ الإشارة مشروطة بتأكيد الحركة عند المستوى."}
 const sl=side==="شراء"?support:z.close+(resistance-z.close);
 const risk=Math.max(Math.abs(z.close-sl),z.close*.002);
 const entry=z.close,tp1=side==="شراء"?entry+risk:entry-risk,tp2=side==="شراء"?entry+2*risk:entry-2*risk,tp3=side==="شراء"?entry+3*risk:entry-3*risk;
 const confidence=Math.min(92,58+(side==="حيادي"?0:12)+(pattern!=="حركة سعرية"?10:0));
 return {p,z,side,pattern,reason,entry,tp1,tp2,tp3,sl,confidence};
}
function make(sym,icon,name,idx){
 const s=document.createElement("section");s.className="coin";s.innerHTML=
 '<div class="head"><div><div class="name">'+icon+" "+name+'</div><div class="sub">'+sym+' · '+tf+' · تحليل مستقل</div></div><div class="live" id="live'+idx+'">● LIVE</div></div>'+
 '<div class="cw"><div class="tools"><button id="m'+idx+'">−</button><button id="r'+idx+'">↺</button><button id="p'+idx+'">+</button></div><div id="c'+idx+'" class="chart"></div></div>'+
 '<div class="analysis"><div id="pat'+idx+'" class="pattern">جاري الرسم...</div><div id="sig'+idx+'" class="signal">جاري التحليل...</div><div id="lev'+idx+'" class="levels"></div><div id="why'+idx+'" class="reason"></div></div>';
 feed.appendChild(s);return s;
}
async function render(sym,icon,name,idx){
 const el=document.getElementById("c"+idx),chart=LightweightCharts.createChart(el,{layout:{background:{type:"solid",color:"#0a0e14"},textColor:"#8995a4"},grid:{vertLines:{color:"#171e27"},horzLines:{color:"#171e27"}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false}});
 const cs=chart.addCandlestickSeries({upColor:"#25d69b",downColor:"#ff5b72",borderUpColor:"#25d69b",borderDownColor:"#ff5b72",wickUpColor:"#25d69b",wickDownColor:"#ff5b72"});
 new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
 let data=[],lines=[];
 async function load(){
  try{
   const url="https://api.binance.com/api/v3/klines?symbol="+sym+"&interval="+TF[tf]+"&limit=180";
   const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error();
   data=(await r.json()).map(v=>({time:Math.floor(v[0]/1000),open:+v[1],high:+v[2],low:+v[3],close:+v[4]}));cs.setData(data);
   lines.forEach(x=>{try{cs.removePriceLine(x)}catch(e){}});lines=[];
   const x=analyze(data);
   const add=(v,t,c)=>{if(Number.isFinite(v))lines.push(cs.createPriceLine({price:v,title:t,color:c,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}))};
   add(x.entry,"دخول","#4da3ff");add(x.tp1,"TP1","#25d69b");add(x.tp2,"TP2","#25d69b");add(x.tp3,"TP3","#25d69b");add(x.sl,"SL","#ff5b72");
   const trend=x.p.hi.slice(-2).map(i=>data[i]).concat(x.p.lo.slice(-2).map(i=>data[i]));
   if(x.p.hi.length>=2){const a=data[x.p.hi.at(-2)],b=data[x.p.hi.at(-1)];const ts=chart.addLineSeries({color:"#7b8797",lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed});ts.setData([{time:a.time,value:a.high},{time:b.time,value:b.high}]);setTimeout(()=>{},0)}
   if(x.p.lo.length>=2){const a=data[x.p.lo.at(-2)],b=data[x.p.lo.at(-1)];const ts=chart.addLineSeries({color:"#7b8797",lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed});ts.setData([{time:a.time,value:a.low},{time:b.time,value:b.low}])}
   document.getElementById("pat"+idx).innerHTML='<span class="badge">'+x.pattern+'</span><span class="badge">'+tf+'</span>';
   const cls=x.side==="شراء"?"green":x.side==="بيع"?"red":"gray";
   document.getElementById("sig"+idx).innerHTML='<span class="'+cls+'">'+x.side+'</span> · AI '+x.confidence+'%';
   document.getElementById("lev"+idx).innerHTML=[["دخول",x.entry],["TP1",x.tp1],["TP2",x.tp2],["TP3",x.tp3],["SL",x.sl]].map(q=>'<div class="lv">'+q[0]+'<b>'+fmt(q[1])+'</b></div>').join("");
   document.getElementById("why"+idx).textContent=x.reason;
   document.getElementById("live"+idx).textContent="● LIVE";
   chart.timeScale().fitContent();
  }catch(e){document.getElementById("live"+idx).textContent="● تعذر جلب البيانات"}}
 document.getElementById("m"+idx).onclick=()=>chart.timeScale().scrollToPosition(10,true);
 document.getElementById("p"+idx).onclick=()=>chart.timeScale().scrollToPosition(-10,true);
 document.getElementById("r"+idx).onclick=()=>chart.timeScale().fitContent();
 await load();setInterval(load,30000);
}
function build(){feed.innerHTML="";COINS.forEach((c,i)=>{make(c[0],c[1],c[2],i);render(c[0],c[1],c[2],i)});}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");tf=b.dataset.t;build()});
build();
</script>
</body></html>
