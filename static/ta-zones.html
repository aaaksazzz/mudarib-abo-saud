<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TA Zones — تحليل حركة السعر</title><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#eef2f7;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:1250px;margin:auto}.card{background:#11151d;border:1px solid #252c38;border-radius:16px;overflow:hidden}.head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #202733}.title{font-size:19px;font-weight:900}.sub{font-size:11px;color:#778395;margin-top:4px}.live{font-size:11px;color:#20d99a}.tf{display:flex;gap:6px;padding:9px;overflow:auto;background:#0c1016;border-bottom:1px solid #202733}.tf button{border:1px solid #293241;background:#141a23;color:#aab5c2;border-radius:8px;padding:8px 13px;white-space:nowrap}.tf button.active{background:#e9f4ef;color:#07100d}.chart{height:650px}.mini .tf,.mini .foot,.mini .note{display:none}.mini{padding:0}.mini .card{border:0;border-radius:12px}.mini .chart{height:300px}.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.box{background:#0c1016;border:1px solid #202733;border-radius:12px;padding:10px}.signal{font-size:23px;font-weight:900}.muted{color:#778395;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;padding:6px 9px;background:#151b24;border:1px solid #293241;border-radius:7px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lv{background:#141a23;border:1px solid #293241;border-radius:8px;padding:8px;text-align:center;font-size:10px;color:#8793a1}.lv b{display:block;color:#eef2f7;font-size:12px;margin-top:4px}.note{padding:0 12px 12px;color:#667384;font-size:10px}@media(max-width:700px){body{padding:6px}.chart{height:560px}.foot{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="card"><header class="head"><div><div class="title" id="title">المحلل الذكي</div><div class="sub">تحليل حركة السعر داخل الشارت فقط — بدون مؤشرات</div></div><div class="live" id="live">● LIVE</div></header><nav class="tf"><button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button></nav><div id="chart" class="chart"></div><div class="foot"><div class="box"><div id="signal" class="signal">جاري التحليل...</div><div id="chips" class="chips"></div></div><div class="box"><div id="levels" class="levels"></div></div></div><div class="note">التحليل مرسوم داخل الشارت من حركة السعر فقط: قمم وقيعان، دعم ومقاومة، ترند، اختراق وإعادة اختبار.</div></section></main><script>
const q=new URLSearchParams(location.search),symbol=(q.get("symbol")||"BTCUSDT").toUpperCase(),market=q.get("market")||"spot",mini=q.get("mini")==="1";document.body.classList.toggle("mini",mini);let tf=q.get("tf")||"15m",chart,cs;
const UP="#20d99a",DN="#ff5570",GOLD="#f5c451",GRID="#1b222d";const el=document.getElementById("chart");
function fmt(v){return Number(v).toLocaleString("en-US",{maximumFractionDigits:8})}
function make(){chart=LightweightCharts.createChart(el,{layout:{background:{type:"solid",color:"#0b0f15"},textColor:"#9aa7b5"},grid:{vertLines:{color:GRID},horzLines:{color:GRID}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false,timeVisible:false,secondsVisible:false}});cs=chart.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN});new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el)}
function swings(a){let h=[],l=[];for(let i=3;i<a.length-3;i++){if(a[i].high>a[i-1].high&&a[i].high>a[i+1].high&&a[i].high>a[i-2].high&&a[i].high>a[i+2].high&&a[i].high>a[i-3].high&&a[i].high>a[i+3].high)h.push(i);if(a[i].low<a[i-1].low&&a[i].low<a[i+1].low&&a[i].low<a[i-2].low&&a[i].low<a[i+2].low&&a[i].low<a[i-3].low&&a[i].low<a[i+3].low)l.push(i)}return{h,l}}
function setup(a){let s=swings(a),hs=s.h,ls=s.l,ph=hs.at(-1),ph2=hs.at(-2),pl=ls.at(-1),pl2=ls.at(-2),z=a.at(-1);let hh=ph!=null&&ph2!=null&&a[ph].high>a[ph2].high,hl=pl!=null&&pl2!=null&&a[pl].low>a[pl2].low,lh=ph!=null&&ph2!=null&&a[ph].high<a[ph2].high,ll=pl!=null&&pl2!=null&&a[pl].low<a[pl2].low,res=ph!=null?a[ph].high:null,sup=pl!=null?a[pl].low:null,bo=null,rt=null;if(res&&z.close>res){bo="up";for(let i=ph+1;i<a.length;i++)if(a[i].low<=res*1.002&&a[i].close>res){rt=i;break}}if(sup&&z.close<sup){bo="down";for(let i=pl+1;i<a.length;i++)if(a[i].high>=sup*.998&&a[i].close<sup){rt=i;break}}let side=bo==="up"||(!bo&&hh&&hl)?"شراء":bo==="down"||(!bo&&lh&&ll)?"بيع":"حيادي",entry=z.close,sl=null,tp1=null,tp2=null,tp3=null;if(side==="شراء"){sl=rt!=null?Math.min(a[rt].low,sup||a[rt].low):sup;if(sl>=entry)sl=null;let r=sl?entry-sl:entry*.003;tp1=entry+r;tp2=entry+2*r;tp3=entry+3*r}if(side==="بيع"){sl=rt!=null?Math.max(a[rt].high,res||a[rt].high):res;if(sl<=entry)sl=null;let r=sl?sl-entry:entry*.003;tp1=entry-r;tp2=entry-2*r;tp3=entry-3*r}let conf=Math.min(95,55+(hh&&hl||lh&&ll?10:0)+(bo?15:0)+(rt!=null?10:0)+(Math.abs(z.close-z.open)/(z.high-z.low||1)>.55?5:0));return{hs,ls,res,sup,bo,rt,side,entry,sl,tp1,tp2,tp3,conf}}
function render(a){let x=setup(a);cs.setData(a);if(window.lines)window.lines.forEach(v=>{try{cs.removePriceLine(v)}catch(e){}});window.lines=[];function pl(v,t,c){if(v==null)return;window.lines.push(cs.createPriceLine({price:v,title:t,color:c,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}))}pl(x.res,"مقاومة",DN);pl(x.sup,"دعم",UP);pl(x.entry,"دخول",GOLD);if(x.side!=="حيادي"){pl(x.tp1,"TP1",UP);pl(x.tp2,"TP2",UP);pl(x.tp3,"TP3",UP);pl(x.sl,"SL",DN)}let m=[];x.hs.slice(-8).forEach((i,k)=>{let p=k?x.hs[x.hs.length-8+k-1]:null;m.push({time:a[i].time,position:"aboveBar",color:DN,shape:"circle",text:p!=null?(a[i].high>a[p].high?"HH":"LH"):"H"})});x.ls.slice(-8).forEach((i,k)=>{let p=k?x.ls[x.ls.length-8+k-1]:null;m.push({time:a[i].time,position:"belowBar",color:UP,shape:"circle",text:p!=null?(a[i].low>a[p].low?"HL":"LL"):"L"})});if(x.bo){let i=x.rt!=null?x.rt:a.length-1;m.push({time:a[i].time,position:x.bo==="up"?"belowBar":"aboveBar",color:x.bo==="up"?UP:DN,shape:x.bo==="up"?"arrowUp":"arrowDown",text:x.rt!=null?"إعادة اختبار":x.bo==="up"?"اختراق":"كسر"})}cs.setMarkers(m.sort((u,v)=>u.time-v.time));chart.timeScale().fitContent();let col=x.side==="شراء"?UP:x.side==="بيع"?DN:"#9aa7b5";document.getElementById("signal").innerHTML='<span style="color:'+col+'">'+x.side+'</span> <span class="muted">· AI '+x.conf+'%</span>';document.getElementById("chips").innerHTML=["هيكل "+(x.side==="شراء"?"صاعد":x.side==="بيع"?"هابط":"نطاق"),x.bo?(x.bo==="up"?"اختراق مقاومة":"كسر دعم"):"لا يوجد كسر",x.rt!=null?"إعادة اختبار":"بدون إعادة اختبار"].map(v=>'<span class="chip">'+v+"</span>").join("");document.getElementById("levels").innerHTML=[["دخول",x.entry],["TP1",x.tp1],["TP2",x.tp2],["TP3",x.tp3],["SL",x.sl]].map(v=>'<div class="lv">'+v[0]+"<b>"+fmt(v[1])+"</b></div>").join("")}
async function load(){try{let base=market==="futures"?"https://fapi.binance.com/fapi/v1/klines":"https://api.binance.com/api/v3/klines",r=await fetch(base+"?symbol="+encodeURIComponent(symbol)+"&interval="+tf+"&limit="+(mini?120:180),{cache:"no-store"});if(!r.ok)throw Error();let j=await r.json();let a=j.map(v=>({time:Math.floor(v[0]/1000),open:+v[1],high:+v[2],low:+v[3],close:+v[4]}));render(a);document.getElementById("title").textContent="المحلل الذكي · "+symbol+" · "+tf;document.getElementById("live").textContent="● LIVE · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){document.getElementById("live").textContent="● تعذر جلب البيانات"}}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;document.querySelectorAll("[data-t]").forEach(z=>z.classList.toggle("active",z===b));load()});make();load();if(!mini)setInterval(load,30000);
</script></body></html>
