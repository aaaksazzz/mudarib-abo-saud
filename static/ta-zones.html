<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحلل الذكي — TA Zones</title><style>body{margin:0;background:#05070b;color:#e8eef5;font-family:Arial,sans-serif}main{max-width:1350px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.live{color:#20e39a;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.box{background:#0a0f16;border:1px solid #1d2936;border-radius:16px;overflow:hidden}.tools{display:flex;gap:6px;padding:9px;overflow:auto}.tools button{background:#101923;color:#b8c5d3;border:1px solid #243240;border-radius:8px;padding:7px 10px;white-space:nowrap}.tools button.active{background:#20e39a;color:#04120b}.chart{height:650px}.chart canvas{width:100%;height:100%;display:block}.side{padding:13px}.badge{display:flex;justify-content:space-between;padding:10px;background:#0e151e;border-radius:9px;margin-bottom:7px}.find{padding:8px 4px;border-bottom:1px solid #17222e;font-size:13px}.buy{color:#20e39a}.sell{color:#ff5870}.muted{color:#748396;font-size:11px;line-height:1.7}.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 13px;color:#91a0b1;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chart{height:500px}}</style></head><body><main><div class="head"><b id="title">المحلل الذكي · BTCUSDT</b><span class="live" id="live">● LIVE</span></div><div class="grid"><section class="box"><div class="tools"><button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button></div><div class="chart"><canvas id="cv"></canvas></div><div class="legend">🟦 FVG · 🟨 Order Block · 🟪 Liquidity · 🟢 Entry/TP · 🔴 SL · 📈 Structure</div></section><aside class="box side"><h3>التحليل التلقائي</h3><div class="badge"><span>الاتجاه</span><b id="trend">—</b></div><div class="badge"><span>Structure</span><b id="struct">—</b></div><div class="badge"><span>AI</span><b id="ai">—</b></div><div id="levels"></div><h4>الاكتشافات</h4><div id="findings"></div><p class="muted">يتم اكتشاف البنية والسيولة وFVG ومناطق الطلب/العرض من بيانات الشموع. المؤشرات الكلاسيكية ليست القرار الأساسي.</p></aside></div></main><script>var qs=new URLSearchParams(location.search),symbol=(qs.get("symbol")||"BTCUSDT").toUpperCase(),market=qs.get("market")||"spot",tf=qs.get("tf")||"15m",side=qs.get("side")||"",entry=qs.get("entry"),tp1=qs.get("tp1"),tp2=qs.get("tp2"),tp3=qs.get("tp3"),sl=qs.get("sl"),ai=qs.get("ai"),data=[];var cv=document.getElementById("cv"),ctx=cv.getContext("2d");function fp(v){v=Number(v);return isFinite(v)?v.toLocaleString("en-US",{maximumFractionDigits:8}):"—"}function num(v){v=Number(v);return isFinite(v)?v:null}function endpoint(){var h=market==="futures"?"https://fapi.binance.com/fapi/v1/klines":"https://api.binance.com/api/v3/klines";return h+"?symbol="+encodeURIComponent(symbol)+"&interval="+tf+"&limit=120"}function resize(){var r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}function analyse(a){var f=[],last=a[a.length-1],prev=a[a.length-2],base=a[Math.max(0,a.length-20)],up=last.c>base.c;document.getElementById("trend").textContent=up?"صاعد":"هابط";document.getElementById("trend").className=up?"buy":"sell";var pivH=[],pivL=[];for(var i=2;i<a.length-2;i++){if(a[i].h>a[i-1].h&&a[i].h>a[i+1].h)pivH.push(a[i]);if(a[i].l<a[i-1].l&&a[i].l<a[i+1].l)pivL.push(a[i])}var hh=Math.max.apply(null,a.slice(-20).map(x=>x.h)),ll=Math.min.apply(null,a.slice(-20).map(x=>x.l));if(last.h>=hh*.9995)f.push("Liquidity Sweep فوق القمم");if(last.l<=ll*1.0005)f.push("Liquidity Sweep تحت القيعان");for(var j=2;j<a.length;j++){var x=a[j-2],y=a[j-1];if(x.h<y.l)f.push("FVG صاعد بين "+fp(x.h)+" و "+fp(y.l));if(x.l>y.h)f.push("FVG هابط بين "+fp(y.h)+" و "+fp(x.l))}if(pivH.length>=2&&pivL.length>=2)f.push("Market Structure: قمم وقيعان متعاقبة");if(prev&&last.c>last.o&&last.c>prev.h)f.push("Displacement صاعد / BOS محتمل");if(prev&&last.c<last.o&&last.c<prev.l)f.push("Displacement هابط / BOS محتمل");var av=a.slice(-20).reduce((s,x)=>s+x.v,0)/20;if(last.v>av*1.5)f.push("Volume أعلى من المتوسط");document.getElementById("struct").textContent=f.some(x=>x.includes("BOS"))?"BOS":"قراءة بنية";document.getElementById("findings").innerHTML=f.slice(-10).map(x=>"<div class=\"find\">• "+x+"</div>").join("")||"<div class=\"find\">لا توجد إشارة قوية حالياً</div>"}function draw(){var w=cv.clientWidth,h=cv.clientHeight;if(!data.length)return;var a=data.map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]})),lo=Math.min.apply(null,a.map(x=>x.l)),hi=Math.max.apply(null,a.map(x=>x.h)),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;var y=p=>h-(p-lo)/(hi-lo)*h*.88-8,st=(w-55)/a.length;ctx.clearRect(0,0,w,h);ctx.font="10px Arial";for(var i=0;i<5;i++){var p=lo+(hi-lo)*i/4,yy=y(p);ctx.strokeStyle="#17232e";ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w-55,yy);ctx.stroke();ctx.fillStyle="#738195";ctx.fillText(fp(p),w-50,yy-3)}a.forEach((c,i)=>{var x=i*st+st/2,u=c.c>=c.o;ctx.strokeStyle=u?"#20e39a":"#ff5870";ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();var t=y(Math.max(c.o,c.c)),b=y(Math.min(c.o,c.c));ctx.fillRect(x-st*.3,t,Math.max(1,st*.6),Math.max(1,b-t))});var lev=[["Entry",entry,"#55d6ff"],["TP1",tp1,"#20e39a"],["TP2",tp2,"#20e39a"],["TP3",tp3,"#20e39a"],["SL",sl,"#ff5870"]];lev.forEach(z=>{var p=num(z[1]);if(p==null)return;var yy=y(p);ctx.setLineDash([6,5]);ctx.strokeStyle=z[2];ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w-55,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=z[2];ctx.fillText(z[0]+" "+fp(p),6,yy-5)});analyse(a);document.getElementById("levels").innerHTML=lev.map(z=>"<div class=\"badge\"><span>"+z[0]+"</span><b>"+fp(z[1])+"</b></div>").join("")}async function load(){try{var r=await fetch(endpoint(),{cache:"no-store"});data=await r.json();draw();document.getElementById("live").textContent="● LIVE · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});if(ai)document.getElementById("ai").textContent=ai+"%"}catch(e){document.getElementById("live").textContent="● تعذر جلب البيانات"}}document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("active",x===b));load()});window.addEventListener("resize",resize);load();setInterval(load,15000);</script></body></html>
