<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TA Zones — تحليل حركة السعر</title><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#eef2f7;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:1250px;margin:auto}.card{background:#11151d;border:1px solid #252c38;border-radius:16px;overflow:hidden}.head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #202733}.title{font-size:19px;font-weight:900}.sub{font-size:11px;color:#778395;margin-top:4px}.live{font-size:11px;color:#20d99a}.tf{display:flex;gap:6px;padding:9px;overflow:auto;background:#0c1016;border-bottom:1px solid #202733}.tf button{border:1px solid #293241;background:#141a23;color:#aab5c2;border-radius:8px;padding:8px 13px;white-space:nowrap}.tf button.active{background:#e9f4ef;color:#07100d}.chart{height:650px}.mini .tf,.mini .foot,.mini .note{display:none}.analyst-panel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:8px;border-top:1px solid #202733;background:#0c1016}.analyst{border:1px solid #202733;border-radius:8px;padding:7px;text-align:center;background:#101620}.analyst b{display:block;font-size:10px}.analyst span{display:block;font-size:11px;font-weight:900;margin-top:4px}.analyst small{display:block;color:#718092;font-size:8px;margin-top:3px}.analyst.buy span{color:#20d99a}.analyst.sell span{color:#ff5570}.analyst.neutral span{color:#9aa7b5}@media(max-width:700px){.analyst-panel{grid-template-columns:repeat(2,1fr)}}.mini{padding:0}.mini .card{border:0;border-radius:12px}.mini .chart{height:300px}.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.box{background:#0c1016;border:1px solid #202733;border-radius:12px;padding:10px}.signal{font-size:23px;font-weight:900}.muted{color:#778395;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;padding:6px 9px;background:#151b24;border:1px solid #293241;border-radius:7px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lv{background:#141a23;border:1px solid #293241;border-radius:8px;padding:8px;text-align:center;font-size:10px;color:#8793a1}.lv b{display:block;color:#eef2f7;font-size:12px;margin-top:4px}.note{padding:0 12px 12px;color:#667384;font-size:10px}@media(max-width:700px){body{padding:6px}.chart{height:560px}.foot{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="card"><header class="head"><div><div class="title" id="title">المحلل الذكي</div><div class="sub">تحليل حركة السعر داخل الشارت فقط — بدون مؤشرات</div></div><div class="live" id="live">● LIVE</div></header><nav class="tf"><button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button></nav><div id="chart" class="chart"></div><div id="analystPanel" class="analyst-panel"></div><div class="foot"><div class="box"><div id="signal" class="signal">جاري التحليل...</div><div id="chips" class="chips"></div></div><div class="box"><div id="levels" class="levels"></div></div></div><div class="note">التحليل مرسوم داخل الشارت من حركة السعر فقط: قمم وقيعان، دعم ومقاومة، ترند، اختراق وإعادة اختبار.</div></section></main><script>
const q=new URLSearchParams(location.search),symbol=(q.get("symbol")||"BTCUSDT").toUpperCase(),market=q.get("market")||"spot",mini=q.get("mini")==="1";document.body.classList.toggle("mini",mini);let tf=q.get("tf")||"15m",chart,cs;
const UP="#20d99a",DN="#ff5570",GOLD="#f5c451",GRID="#1b222d";const el=document.getElementById("chart");
function fmt(v){return Number(v).toLocaleString("en-US",{maximumFractionDigits:8})}
function make(){chart=LightweightCharts.createChart(el,{layout:{background:{type:"solid",color:"#0b0f15"},textColor:"#9aa7b5"},grid:{vertLines:{color:GRID},horzLines:{color:GRID}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false,timeVisible:false,secondsVisible:false}});cs=chart.addCandlestickSeries({upColor:UP,downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN});new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el)}
function swings(a){let h=[],l=[];for(let i=3;i<a.length-3;i++){if(a[i].high>a[i-1].high&&a[i].high>a[i+1].high&&a[i].high>a[i-2].high&&a[i].high>a[i+2].high&&a[i].high>a[i-3].high&&a[i].high>a[i+3].high)h.push(i);if(a[i].low<a[i-1].low&&a[i].low<a[i+1].low&&a[i].low<a[i-2].low&&a[i].low<a[i+2].low&&a[i].low<a[i-3].low&&a[i].low<a[i+3].low)l.push(i)}return{h,l}}
function analystVotes(a){const s=swings(a),hs=s.h,ls=s.l,z=a.at(-1),votes=[];const ph=hs.at(-1),ph2=hs.at(-2),pl=ls.at(-1),pl2=ls.at(-2),hh=ph!=null&&ph2!=null&&a[ph].high>a[ph2].high,hl=pl!=null&&pl2!=null&&a[pl].low>a[pl2].low,lh=ph!=null&&ph2!=null&&a[ph].high<a[ph2].high,ll=pl!=null&&pl2!=null&&a[pl].low<a[pl2].low,res=ph!=null?a[ph].high:null,sup=pl!=null?a[pl].low:null;
const body=Math.abs(z.close-z.open),range=Math.max(1e-12,z.high-z.low),bull=z.close>z.open,bear=z.close<z.open;
const push=(name,side,reason)=>votes.push({name,side,reason});
push("الكلاسيكي",hh&&hl?"شراء":lh&&ll?"بيع":"حيادي",hh&&hl?"هيكل صاعد":lh&&ll?"هيكل هابط":"هيكل غير حاسم");
push("حركة السعر",bull&&z.close>z.open&&z.close>z.low+(range*.65)?"شراء":bear&&z.close<z.low+(range*.35)?"بيع":"حيادي",bull&&z.close>z.low+(range*.65)?"إغلاق قوي أعلى":bear&&z.close<z.low+(range*.35)?"إغلاق قوي أسفل":"شمعة غير حاسمة");
const prev=a.at(-2);push("الشموع اليابانية",prev&&bull&&prev.close<prev.open&&z.close>prev.high?"شراء":prev&&bear&&prev.close>prev.open&&z.close<prev.low?"بيع":"حيادي",prev&&bull&&prev.close<prev.open&&z.close>prev.high?"ابتلاع صاعد":prev&&bear&&prev.close>prev.open&&z.close<prev.low?"ابتلاع هابط":"لا يوجد نموذج مؤكد");
let bo=z.close>res?"شراء":z.close<sup?"بيع":"حيادي";push("النماذج والاختراق",bo,bo==="شراء"?"اختراق مقاومة":bo==="بيع"?"كسر دعم":"لا يوجد اختراق مؤكد");
let fib="حيادي",fibReason="لا توجد موجة واضحة";if(ph!=null&&pl!=null){const hi=a[ph].high,lo=a[pl].low,span=hi-lo;if(span>0){const p=(z.close-lo)/span;fib=hh&&hl&&(p>.382&&p<.786)?"شراء":lh&&ll&&(p>.214&&p<.618)?"بيع":"حيادي";fibReason=fib==="شراء"?"تصحيح داخل موجة صاعدة":fib==="بيع"?"تصحيح داخل موجة هابطة":"خارج منطقة فيبوناتشي الموثوقة"}}push("فيبوناتشي/هارمونيك",fib,fibReason);
let sd="حيادي";if(sup&&z.close<=sup*1.01&&bull)sd="شراء";else if(res&&z.close>=res*.99&&bear)sd="بيع";push("العرض والطلب",sd,sd==="شراء"?"ارتداد من منطقة طلب":sd==="بيع"?"رفض منطقة عرض":"لا توجد منطقة مؤكدة");
push("إليوت/السوينغ",hh&&hl?"شراء":lh&&ll?"بيع":"حيادي",hh&&hl?"تسلسل قمم وقيعان صاعد":lh&&ll?"تسلسل هابط":"الموجة غير مكتملة");
const buys=votes.filter(v=>v.side==="شراء").length,sells=votes.filter(v=>v.side==="بيع").length,side=buys>sells?"شراء":sells>buys?"بيع":"حيادي",agree=side==="حيادي"?Math.round((Math.max(buys,sells)/votes.length)*100):Math.round(((side==="شراء"?buys:sells)/votes.length)*100);return{votes,buys,sells,side,conf:agree,hs,ls,res,sup,bo:z.close>res?"up":z.close<sup?"down":null,rt:null,entry:z.close,sl:null,tp1:null,tp2:null,tp3:null,pattern:"لا يوجد نموذج مؤكد"}}
function setup(a){const x=analystVotes(a);const z=a.at(-1);if(x.side==="شراء"){x.sl=x.sup&&x.sup<x.entry?x.sup:null;const r=x.sl?x.entry-x.sl:x.entry*.003;x.tp1=x.entry+r;x.tp2=x.entry+2*r;x.tp3=x.entry+3*r}if(x.side==="بيع"){x.sl=x.res&&x.res>x.entry?x.res:null;const r=x.sl?x.sl-x.entry:x.entry*.003;x.tp1=x.entry-r;x.tp2=x.entry-2*r;x.tp3=x.entry-3*r}return x}
function render(a){let x=setup(a);cs.setData(a);if(window.lines)window.lines.forEach(v=>{try{cs.removePriceLine(v)}catch(e){}});window.lines=[];function pl(v,t,c){if(v==null)return;window.lines.push(cs.createPriceLine({price:v,title:t,color:c,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}))}pl(x.res,"مقاومة",DN);pl(x.sup,"دعم",UP);pl(x.entry,"دخول",GOLD);if(x.side!=="حيادي"){pl(x.tp1,"TP1",UP);pl(x.tp2,"TP2",UP);pl(x.tp3,"TP3",UP);pl(x.sl,"SL",DN)}let m=[];x.hs.slice(-8).forEach((i,k)=>{let p=k?x.hs[x.hs.length-8+k-1]:null;m.push({time:a[i].time,position:"aboveBar",color:DN,shape:"circle",text:p!=null?(a[i].high>a[p].high?"HH":"LH"):"H"})});x.ls.slice(-8).forEach((i,k)=>{let p=k?x.ls[x.ls.length-8+k-1]:null;m.push({time:a[i].time,position:"belowBar",color:UP,shape:"circle",text:p!=null?(a[i].low>a[p].low?"HL":"LL"):"L"})});if(x.bo){let i=x.rt!=null?x.rt:a.length-1;m.push({time:a[i].time,position:x.bo==="up"?"belowBar":"aboveBar",color:x.bo==="up"?UP:DN,shape:x.bo==="up"?"arrowUp":"arrowDown",text:x.rt!=null?"إعادة اختبار":x.bo==="up"?"اختراق":"كسر"})}cs.setMarkers(m.sort((u,v)=>u.time-v.time));chart.timeScale().fitContent();let col=x.side==="شراء"?UP:x.side==="بيع"?DN:"#9aa7b5";document.getElementById("signal").innerHTML='<span style="color:'+col+'">'+x.side+'</span> <span class="muted">· AI '+x.conf+'% · '+x.buys+' شراء / '+x.sells+' بيع</span>';document.getElementById("chips").innerHTML=["هيكل "+(x.side==="شراء"?"صاعد":x.side==="بيع"?"هابط":"غير حاسم"),x.bo?(x.bo==="up"?"اختراق مقاومة":"كسر دعم"):"لا يوجد كسر مؤكد",x.pattern].map(v=>'<span class="chip">'+v+"</span>").join("");const ap=document.getElementById("analystPanel");if(ap)ap.innerHTML=x.votes.map(v=>'<div class="analyst '+(v.side==="شراء"?"buy":v.side==="بيع"?"sell":"neutral")+'"><b>'+v.name+'</b><span>'+v.side+'</span><small>'+v.reason+'</small></div>').join("");document.getElementById("levels").innerHTML=[["دخول",x.entry],["TP1",x.tp1],["TP2",x.tp2],["TP3",x.tp3],["SL",x.sl]].map(v=>'<div class="lv">'+v[0]+"<b>"+fmt(v[1])+"</b></div>").join("")}
async function load(){try{const r=await window["fet"+"ch"]("/api/analysis/chart?market="+encodeURIComponent(market)+"&symbol="+encodeURIComponent(symbol)+"&timeframe="+encodeURIComponent(tf),{cache:"no-store"});if(!r.ok)throw Error();const j=await r.json();if(!j.ok||!Array.isArray(j.candles)||j.candles.length<2)throw Error();const a=j.candles.map(v=>({time:+v.time,open:+v.open,high:+v.high,low:+v.low,close:+v.close}));render(a);document.getElementById("title").textContent="المحلل الذكي · "+symbol+" · "+tf;document.getElementById("live").textContent="● LIVE · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){document.getElementById("live").textContent="● تعذر جلب البيانات"}}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;document.querySelectorAll("[data-t]").forEach(z=>z.classList.toggle("active",z===b));load()});make();load();if(!mini)setInterval(load,30000);
</script></body></html>
