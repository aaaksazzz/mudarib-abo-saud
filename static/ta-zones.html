<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TA Zones — تحليل حركة السعر</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#e8eef5;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.title{font-size:20px;font-weight:900}.muted{color:#8192a5;font-size:11px}.live{color:#20d99a;font-size:12px}.toolbar{display:flex;gap:6px;overflow:auto;padding:8px;background:#0b1118;border:1px solid #1b2734;border-radius:12px 12px 0 0}.toolbar button{background:#101923;color:#aebdcc;border:1px solid #263746;border-radius:8px;padding:9px 14px;white-space:nowrap}.toolbar button.active{background:#e8f5ef;color:#06110c}.chart{height:760px;background:#080d13;border:1px solid #1b2734;border-top:0}.chart canvas{width:100%;height:100%;display:block;touch-action:none}.bottom{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#0b1118;border:1px solid #1b2734;border-radius:12px;padding:10px}.signal{font-size:24px;font-weight:900}.buy{color:#20d99a}.sell{color:#ff5570}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.lv{background:#101923;border:1px solid #243444;border-radius:8px;padding:8px;text-align:center;font-size:11px}.lv b{display:block;margin-top:4px;font-size:13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{padding:6px 9px;border-radius:7px;background:#111a24;border:1px solid #243444;font-size:11px}@media(max-width:700px){.chart{height:620px}.bottom{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><div class="title" id="title">المحلل الذكي</div><div class="muted">تحليل حركة السعر داخل الشارت فقط — بدون مؤشرات</div></div><div class="live" id="live">● LIVE</div></div>
<div class="toolbar"><button data-t="5m" class="">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h" class="">1س</button><button data-t="4h" class="">4س</button><button data-t="1d" class="">يومي</button><button data-t="1w" class="">أسبوعي</button><button data-t="1M" class="">شهري</button></div>
<div class="chart"><canvas id="cv"></canvas></div>
<div class="bottom"><section class="box"><div class="signal" id="signal">جاري التحليل...</div><div class="chips" id="summary"></div></section><section class="box"><div class="levels" id="levels"></div></section></div>
</main>
<script>
const q=new URLSearchParams(location.search),symbol=(q.get("symbol")||"BTCUSDT").toUpperCase(),market=q.get("market")||"spot";let tf=q.get("tf")||"15m",raw=[],A={};
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),UP="#20d99a",DN="#ff5570",TXT="#8192a5",GRID="#172532",GOLD="#f5c451";
const n=x=>+x,fmt=x=>Number.isFinite(x)?x.toLocaleString("en-US",{maximumFractionDigits:8}):"—";
function swings(a){let hs=[],ls=[];for(let i=3;i<a.length-3;i++){let h=a[i].h,l=a[i].l;if(h>a[i-1].h&&h>a[i+1].h&&h>a[i-2].h&&h>a[i+2].h&&h>a[i-3].h&&h>a[i+3].h)hs.push(i);if(l<a[i-1].l&&l<a[i+1].l&&l<a[i-2].l&&l<a[i+2].l&&l<a[i-3].l&&l<a[i+3].l)ls.push(i)}return{hs,ls}};
function analyse(a){
 const {hs,ls}=swings(a),last=a[a.length-1],ph=hs.at(-1),pl=ls.at(-1),ph2=hs.at(-2),pl2=ls.at(-2);
 const hh=ph!=null&&ph2!=null&&a[ph].h>a[ph2].h,lh=ph!=null&&ph2!=null&&a[ph].h<a[ph2].h,hl=pl!=null&&pl2!=null&&a[pl].l>a[pl2].l,ll=pl!=null&&pl2!=null&&a[pl].l<a[pl2].l;
 const bull=hh&&hl, bear=lh&&ll, res=ph!=null?a[ph].h:null,sup=pl!=null?a[pl].l:null;
 let breakout=null,retest=null;
 if(res!=null&&last.c>res){breakout="up";for(let i=Math.max(ph+1,a.length-12);i<a.length;i++)if(a[i].l<=res*1.002&&a[i].c>res){retest=i;break}}
 if(sup!=null&&last.c<sup){breakout="down";for(let i=Math.max(pl+1,a.length-12);i<a.length;i++)if(a[i].h>=sup*.998&&a[i].c<sup){retest=i;break}}
 const side=breakout==="up"||(!breakout&&bull)?"شراء":breakout==="down"||(!breakout&&bear)?"بيع":"حيادي";
 let entry=last.c,sl,tp1,tp2,tp3;
 if(side==="شراء"){sl=(retest!=null?Math.min(a[retest].l,sup||a[retest].l):sup)||a[Math.max(0,a.length-8)].l;let risk=Math.max(entry-sl,entry*.003);tp1=entry+risk;tp2=entry+risk*2;tp3=entry+risk*3}
 else if(side==="بيع"){sl=(retest!=null?Math.max(a[retest].h,res||a[retest].h):res)||a[Math.max(0,a.length-8)].h;let risk=Math.max(sl-entry,entry*.003);tp1=entry-risk;tp2=entry-risk*2;tp3=entry-risk*3}
 let confidence=55+(bull||bear?10:0)+(breakout?15:0)+(retest!=null?10:0)+(Math.abs(last.c-last.o)/(last.h-last.l||1)>.55?5:0);confidence=Math.min(95,confidence);
 A={a,hs,ls,ph,pl,res,sup,bull,bear,breakout,retest,side,entry,sl,tp1,tp2,tp3,confidence}
}
function map(a){let w=cv.clientWidth,h=cv.clientHeight,L=Math.min(...a.map(x=>x.l)),H=Math.max(...a.map(x=>x.h)),pad=(H-L)*.1||1;L-=pad;H+=pad;return{w,h,L,H,x:i=>i*(w-82)/(a.length-1),y:v=>h-((v-L)/(H-L))*h*.88-8}};
function line(m,v,c,label,dash=[6,4],width=1.5){if(!Number.isFinite(v))return;let y=m.y(v);ctx.save();ctx.strokeStyle=c;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(m.w-82,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=c;ctx.font="bold 11px Arial";ctx.fillText(label,8,y-6);ctx.restore()}
function tag(x,y,text,c){ctx.save();ctx.fillStyle=c;ctx.font="bold 12px Arial";ctx.fillText(text,x,y);ctx.restore()}
function draw(){
 if(!A.a)return;let a=A.a,m=map(a),w=m.w,h=m.h;ctx.clearRect(0,0,w,h);ctx.fillStyle="#080d13";ctx.fillRect(0,0,w,h);
 for(let i=1;i<9;i++){let y=i*h/9;ctx.strokeStyle=GRID;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w-82,y);ctx.stroke()}
 const plot=w-82,step=plot/a.length,bw=Math.max(5,step*.68);
 a.forEach((c,i)=>{let x=m.x(i),up=c.c>=c.o;ctx.strokeStyle=up?UP:DN;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,m.y(c.h));ctx.lineTo(x,m.y(c.l));ctx.stroke();let y1=m.y(Math.max(c.o,c.c)),y2=m.y(Math.min(c.o,c.c));ctx.fillRect(x-bw/2,y1,bw,Math.max(2,y2-y1))});
 // Classical support/resistance
 if(A.sup)line(m,A.sup,UP,"دعم",[7,5],2);if(A.res)line(m,A.res,DN,"مقاومة",[7,5],2);
 // Trendlines from confirmed swing structure
 if(A.hs.length>=2){let i1=A.hs.at(-2),i2=A.hs.at(-1);ctx.strokeStyle=DN;ctx.lineWidth=2;ctx.setLineDash([9,5]);ctx.beginPath();ctx.moveTo(m.x(i1),m.y(a[i1].h));ctx.lineTo(m.x(i2),m.y(a[i2].h));ctx.stroke();ctx.setLineDash([])}
 if(A.ls.length>=2){let i1=A.ls.at(-2),i2=A.ls.at(-1);ctx.strokeStyle=UP;ctx.lineWidth=2;ctx.setLineDash([9,5]);ctx.beginPath();ctx.moveTo(m.x(i1),m.y(a[i1].l));ctx.lineTo(m.x(i2),m.y(a[i2].l));ctx.stroke();ctx.setLineDash([])}
 // HH/HL/LH/LL labels
 A.hs.forEach((i,k)=>{let prev=k?A.hs[k-1]:null,lab=prev==null?"H":a[i].h>a[prev].h?"HH":"LH";tag(m.x(i)-8,m.y(a[i].h)-12,lab,lab==="HH"?UP:DN)});
 A.ls.forEach((i,k)=>{let prev=k?A.ls[k-1]:null,lab=prev==null?"L":a[i].l>a[prev].l?"HL":"LL";tag(m.x(i)-8,m.y(a[i].l)+18,lab,lab==="HL"?UP:DN)});
 // Breakout + retest markers
 if(A.breakout){let idx=A.breakout==="up"?A.ph:A.pl,level=A.breakout==="up"?A.res:A.sup;line(m,level,A.breakout==="up"?UP:DN,A.breakout==="up"?"اختراق مقاومة":"كسر دعم",[3,6],2.5);let bi=A.retest!=null?A.retest:Math.min(a.length-1,idx+1);tag(m.x(bi)-35,m.y(a[bi].c)-18,A.retest!=null?"إعادة اختبار":"اختراق",A.breakout==="up"?UP:DN)}
 // Entry / targets / stop are structural, not indicators
 line(m,A.entry,GOLD,"دخول",[3,4],2);if(A.side!=="حيادي"){line(m,A.tp1,UP,"TP1",[4,4],1.4);line(m,A.tp2,UP,"TP2",[4,4],1.4);line(m,A.tp3,UP,"TP3",[4,4],1.4);line(m,A.sl,DN,"SL",[4,4],1.8)}
 ctx.fillStyle="#e8eef5";ctx.font="bold 13px Arial";ctx.fillText("حركة السعر فقط",w-205,24);
}
function panel(){let color=A.side==="شراء"?UP:A.side==="بيع"?DN:TXT;document.getElementById("signal").innerHTML="<span style='color:"+color+"'>"+A.side+"</span> <span class='muted'>· AI "+A.confidence+"%</span>";document.getElementById("summary").innerHTML=["هيكل: "+(A.bull?"صاعد":A.bear?"هابط":"نطاق"),A.breakout?(A.breakout==="up"?"اختراق مقاومة":"كسر دعم"):"لا يوجد كسر مؤكد",A.retest!=null?"إعادة اختبار":"بدون إعادة اختبار","دعم "+fmt(A.sup),"مقاومة "+fmt(A.res)].map(x=>"<span class='chip'>"+x+"</span>").join("");document.getElementById("levels").innerHTML=[["الدخول",A.entry],["TP1",A.tp1],["TP2",A.tp2],["TP3",A.tp3],["SL",A.sl]].map(x=>"<div class='lv'>"+x[0]+"<b>"+fmt(x[1])+"</b></div>").join("")}
async function load(){try{let base=market==="futures"?"https://fapi.binance.com/fapi/v1/klines":"https://api.binance.com/api/v3/klines";let r=await fetch(base+"?symbol="+encodeURIComponent(symbol)+"&interval="+tf+"&limit=160",{cache:"no-store"});if(!r.ok)throw Error();raw=await r.json();analyse(raw.map(x=>({o:n(x[1]),h:n(x[2]),l:n(x[3]),c:n(x[4]),v:n(x[5])})));draw();panel();document.getElementById("title").textContent="المحلل الذكي · "+symbol+" · "+tf;document.getElementById("live").textContent="● LIVE · "+new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}catch(e){document.getElementById("live").textContent="● تعذر جلب البيانات"}}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tf=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("active",x===b));load()});
function resize(){let d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener("resize",resize);addEventListener("load",()=>{resize();load()});setInterval(load,15000);
</script></body></html>
