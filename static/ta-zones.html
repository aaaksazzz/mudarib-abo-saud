<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحلل الذكي — تحليلات العملات الرقمية</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#edf2f7;font-family:Arial,sans-serif;padding:8px}.wrap{max-width:430px;margin:auto}.top{padding:12px 4px;text-align:center}.brand{font-size:22px;font-weight:900}.desc{font-size:11px;color:#758194;margin-top:5px}.tabs{display:flex;gap:5px;overflow:auto;padding:8px 0}.tabs button{border:1px solid #293241;background:#111720;color:#aeb8c5;border-radius:9px;padding:8px 12px;white-space:nowrap;font-weight:700}.tabs button.active{background:#edf5f0;color:#07100d}.coin{background:#10151d;border:1px solid #252e3b;border-radius:16px;overflow:hidden;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #202733}.name{font-size:18px;font-weight:900}.sub{font-size:10px;color:#748092;margin-top:3px}.live{font-size:10px;color:#25d69b}.cw{position:relative}.chart{height:270px}.tools{position:absolute;z-index:5;top:9px;right:9px;display:flex;gap:4px;background:#0b1017dd;border:1px solid #293241;border-radius:9px;padding:4px}.tools button{width:34px;height:30px;border:1px solid #354050;background:#151b24;color:#eef2f7;border-radius:6px;font-size:16px;font-weight:900}.analysis{padding:10px}.pattern{font-size:13px;font-weight:900;margin-bottom:8px}.signal{font-size:20px;font-weight:900;margin-bottom:9px}.green{color:#25d69b}.red{color:#ff5b72}.gray{color:#aeb8c5}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.lv{background:#0b1017;border:1px solid #27313e;border-radius:8px;padding:7px 3px;text-align:center;color:#7f8b9b;font-size:9px}.lv b{display:block;color:#eef2f7;font-size:10px;margin-top:4px}.reason{font-size:10px;color:#8a95a5;margin-top:8px;line-height:1.6}.badge{display:inline-block;border:1px solid #303a49;background:#151b24;border-radius:7px;padding:4px 7px;margin-left:4px;color:#aeb8c5}.empty{padding:30px;text-align:center;color:#778395}
@media(max-width:700px){.chart{height:255px}.levels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">المحلل الذكي</div><div class="desc">تحليلات سعرية مرسومة داخل الشارت — بدون مؤشرات</div></div>
<div class="tabs" id="tabs">
<button data-t="5m">5د</button><button data-t="15m" class="active">15د</button><button data-t="1h">1س</button><button data-t="4h">4س</button><button data-t="1d">يومي</button><button data-t="1w">أسبوعي</button><button data-t="1M">شهري</button>
</div>
<div id="feed"></div>
</main>
<script>
const params=new URLSearchParams(location.search); const URL_SYMBOL=(params.get("symbol")||"BTCUSDT").toUpperCase(); const URL_MARKET=(params.get("market")||"spot").toLowerCase(); const COINS=[[URL_SYMBOL,"◆",URL_SYMBOL]];
const TF={5m:"5m",15m:"15m",1h:"1h",4h:"4h",1d:"1d",1w:"1w",1M:"1M"};
const feed=document.getElementById("feed");let tf=params.get("tf")||"15m";
const fmt=v=>Number(v).toLocaleString("en-US",{maximumFractionDigits:8});
function pivots(a,k=3){
 const hi=[],lo=[];
 for(let i=k;i<a.length-k;i++){
  let H=true,L=true;
  for(let j=1;j<=k;j++){H&&=(a[i].high>=a[i-j].high&&a[i].high>=a[i+j].high);L&&=(a[i].low<=a[i-j].low&&a[i].low<=a[i+j].low)}
  if(H)hi.push(i); if(L)lo.push(i);
 }
 return {hi,lo};
}
function ratio(a,b){return Math.abs(b/a)}
function detect(a,method="classic"){
 const p=pivots(a,3), hs=p.hi.slice(-5), ls=p.lo.slice(-5), z=a[a.length-1], close=z.close;
 let side="حيادي",pattern="حركة سعرية",reason="لا يوجد نموذج مكتمل حالياً",draw=[];
 const addLine=(name,pts,dash=0,width=2)=>draw.push({type:"line",name,points:pts.map(i=>({time:a[i].time,value:i===undefined?0:(a[i].high)})),dash,width});
 const h=hs.map(i=>({i,v:a[i].high})),l=ls.map(i=>({i,v:a[i].low}));
 // Classical structure + trendlines
 if((method==="classic"||method==="price_action")&&h.length>=2&&l.length>=2){
  const hh=h.at(-1).v>h.at(-2).v, hl=l.at(-1).v>l.at(-2).v;
  const lh=h.at(-1).v<h.at(-2).v, ll=l.at(-1).v<l.at(-2).v;
  if(hh&&hl){side="شراء";pattern="اتجاه صاعد";reason="HH + HL — خط الاتجاه الصاعد مرسوم على القيعان.";draw.push({type:"line",name:"خط الاتجاه",points:l.slice(-2).map(x=>({time:a[x.i].time,value:x.v}))})}
  else if(lh&&ll){side="بيع";pattern="اتجاه هابط";reason="LH + LL — خط الاتجاه الهابط مرسوم على القمم.";draw.push({type:"line",name:"خط الاتجاه",points:h.slice(-2).map(x=>({time:a[x.i].time,value:x.v}))})}
 }
 // Head & shoulders / inverse
 if(method==="patterns"&&h.length>=3){
  const q=h.slice(-3);
  if(Math.abs(q[0].v-q[2].v)/q[1].v<.025&&q[1].v>q[0].v*1.02&&close<q[1].v){
   pattern="رأس وكتفين";side="بيع";reason="نموذج رأس وكتفين مكتمل مبدئياً؛ الكتفين والرأس وخط العنق مرسومة.";
   const between=(x,y)=>{let arr=l.filter(v=>v.i>x&&v.i<y);return arr.length?arr.reduce((m,v)=>v.v<m.v?v:m,arr[0]):null};
   const n1=between(q[0].i,q[1].i),n2=between(q[1].i,q[2].i);
   if(n1&&n2)draw.push({type:"pattern",points:q.map(x=>({time:a[x.i].time,value:x.v})),neck:[{time:a[n1.i].time,value:n1.v},{time:a[n2.i].time,value:n2.v}]});
  }
 }
 if(method==="patterns"&&l.length>=3){
  const q=l.slice(-3);
  if(Math.abs(q[0].v-q[2].v)/q[1].v<.025&&q[1].v<q[0].v*.98&&close>q[1].v){
   pattern="رأس وكتفين مقلوب";side="شراء";reason="نموذج رأس وكتفين مقلوب مكتمل مبدئياً؛ الشكل وخط العنق مرسومان.";
   const between=(x,y)=>{let arr=h.filter(v=>v.i>x&&v.i<y);return arr.length?arr.reduce((m,v)=>v.v>m.v?v:m,arr[0]):null};
   const n1=between(q[0].i,q[1].i),n2=between(q[1].i,q[2].i);
   if(n1&&n2)draw.push({type:"pattern",points:q.map(x=>({time:a[x.i].time,value:x.v})),neck:[{time:a[n1.i].time,value:n1.v},{time:a[n2.i].time,value:n2.v}]});
  }
 }
 // Double top / bottom
 if(method==="patterns"&&h.length>=2){
  const q=h.slice(-2); if(Math.abs(q[0].v-q[1].v)/q[0].v<.015&&close<Math.min(q[0].v,q[1].v)*.995){
   pattern="قمة مزدوجة";side="بيع";reason="قمة مزدوجة مع كسر مستوى التأكيد؛ القمتان وخط الكسر مرسومة.";
   const valley=l.find(v=>v.i>q[0].i&&v.i<q[1].i); if(valley)draw.push({type:"double",points:q.map(x=>({time:a[x.i].time,value:x.v})),level:valley.v});
  }
 }
 if(method==="patterns"&&l.length>=2){
  const q=l.slice(-2); if(Math.abs(q[0].v-q[1].v)/q[0].v<.015&&close>Math.max(q[0].v,q[1].v)*1.005){
   pattern="قاع مزدوج";side="شراء";reason="قاع مزدوج مع اختراق مستوى التأكيد؛ القاعان وخط الاختراق مرسومة.";
   const peak=h.find(v=>v.i>q[0].i&&v.i<q[1].i); if(peak)draw.push({type:"double",points:q.map(x=>({time:a[x.i].time,value:x.v})),level:peak.v});
  }
 }
 // Harmonic: X-A-B-C-D with explicit ratios
 const ps=[...p.hi.map(i=>({t:"H",i,v:a[i].high})),...p.lo.map(i=>({t:"L",i,v:a[i].low}))].sort((x,y)=>x.i-y.i);
 if(method==="harmonic"&&ps.length>=5){
  const q=ps.slice(-5); const alternating=q.every((x,i)=>i===0||x.t!==q[i-1].t);
  if(alternating){
   const X=q[0].v,A=q[1].v,B=q[2].v,C=q[3].v,D=q[4].v;
   const XA=Math.abs(A-X),AB=Math.abs(B-A),BC=Math.abs(C-B),CD=Math.abs(D-C);
   const rAB=AB/XA,rBC=BC/AB,rCD=CD/BC;
   const specs=[["Gartley",.618,.382,.886,.786],["Bat",.5,.382,.886,.886],["Butterfly",.786,.382,.886,1.618],["Crab",.618,.382,1,1.618],["Cypher",.382,.382,.786,1.272]];
   const hit=specs.find(s=>Math.abs(rAB-s[1])<=.08&&rBC>=.382&&rBC<=.886&&Math.abs(rCD-s[3])<=.22);
   if(hit){
    pattern="هارمونيك "+hit[0];side=D<C?"شراء":"بيع";reason=hit[0]+" — X-A-B-C-D مرسومة مع نسب AB/XA وBC/AB وCD/BC.";
    draw.push({type:"harmonic",points:q.map(x=>({time:a[x.i].time,value:x.v})),ratios:[["AB/XA",rAB],["BC/AB",rBC],["CD/BC",rCD]]});
   }
  }
 }
 // Fibonacci
 if(method==="fibonacci"&&h.length&&l.length){
  const hi=h.at(-1),lo=l.at(-1),span=hi.v-lo.v;
  if(span>0){
   const r=(close-lo.v)/span;
   if(r>=.382&&r<=.618){pattern="تصحيح فيبوناتشي";side="شراء";reason="السعر داخل منطقة 38.2%–61.8%؛ مستويات فيبوناتشي مرسومة.";draw.push({type:"fib",from:{time:a[lo.i].time,value:lo.v},to:{time:a[hi.i].time,value:hi.v}})}
  }
 }
 const support=l.length?l.at(-1).v:close*.99,resistance=h.length?h.at(-1).v:close*1.01;
 if(method==="supply_demand"){
  const recent=a.slice(-20); const demand=Math.min(...recent.map(x=>x.low)); const supply=Math.max(...recent.map(x=>x.high));
  const mid=(demand+supply)/2; side=close>=mid?"شراء":"بيع"; pattern="منطقة طلب وعرض";
  reason=side==="شراء"?"السعر داخل نطاق الطلب؛ حدود منطقة الطلب/العرض مرسومة.":"السعر داخل نطاق العرض؛ حدود منطقة العرض/الطلب مرسومة.";
  draw.push({type:"zones",demand:[demand,demand+(supply-demand)*.12],supply:[supply-(supply-demand)*.12,supply]});
 }
 if(method==="price_action"){
  const highs=a.slice(-21,-1).map(x=>x.high), lows=a.slice(-21,-1).map(x=>x.low); const rh=Math.max(...highs), rl=Math.min(...lows);
  if(close>rh){side="شراء";pattern="اختراق سعري";reason="إغلاق أعلى أعلى قمة في آخر 20 شمعة؛ مستوى الاختراق مرسوم.";draw.push({type:"breakout",level:rh});}
  else if(close<rl){side="بيع";pattern="كسر سعري";reason="إغلاق أسفل أدنى قاع في آخر 20 شمعة؛ مستوى الكسر مرسوم.";draw.push({type:"breakout",level:rl});}
 }
 if(method==="candlestick"){
  const q=a.slice(-3); const last=q.at(-1), prev=q.at(-2); const body=Math.abs(last.close-last.open), range=Math.max(last.high-last.low,1e-12), lower=Math.min(last.open,last.close)-last.low, upper=last.high-Math.max(last.open,last.close);
  if(last.close>last.open&&lower>body*2&&upper<body){side="شراء";pattern="شمعة Hammer";reason="شمعة انعكاسية صاعدة مكتشفة؛ تم إبراز آخر شمعة."}
  else if(last.close<last.open&&upper>body*2&&lower<body){side="بيع";pattern="شمعة Shooting Star";reason="شمعة انعكاسية هابطة مكتشفة؛ تم إبراز آخر شمعة."}
  else if(last.close>last.open&&prev.close<prev.open&&last.close>prev.open&&last.open<prev.close){side="شراء";pattern="ابتلاع شرائي";reason="Bullish Engulfing مكتشف؛ تم إبراز الشمعتين."}
  else if(last.close<last.open&&prev.close>prev.open&&last.close<prev.open&&last.open>prev.close){side="بيع";pattern="ابتلاع بيعي";reason="Bearish Engulfing مكتشف؛ تم إبراز الشمعتين."}
  draw.push({type:"candle",points:q.map(x=>({time:x.time,value:x.close}))});
 }
 if(method==="elliott"){pattern="موجة سعرية";side=close>=support+(resistance-support)*.5?"شراء":"بيع";reason="تسلسل موجي سعري تقريبي؛ الرسم مبني على آخر نقاط التأرجح." ; if(h.length>=2&&l.length>=2) draw.push({type:"line",name:"الموجة",points:[...h.slice(-2),...l.slice(-2)].sort((u,v)=>u.i-v.i).map(x=>({time:a[x.i].time,value:x.v}))});}
 if(method==="patterns"||method==="classic"||method==="price_action"){}
 if(side==="حيادي"){side=close>=(support+resistance)/2?"شراء":"بيع";reason="لا يوجد نموذج مكتمل حالياً ضمن المنهج المختار."}
 const sl=side==="شراء"?support:resistance,risk=Math.max(Math.abs(close-sl),close*.002);
 return {p,side,pattern,reason,entry:close,tp1:side==="شراء"?close+risk:close-risk,tp2:side==="شراء"?close+2*risk:close-2*risk,tp3:side==="شراء"?close+3*risk:close-3*risk,sl,confidence:Math.min(94,70+(pattern!=="حركة سعرية"?12:0)),draw};
}
function make(sym,icon,name,idx){
 const s=document.createElement("section");s.className="coin";s.innerHTML=
 '<div class="head"><div><div class="name">'+icon+" "+name+'</div><div class="sub">'+sym+' · '+tf+' · تحليل مستقل</div></div><div class="live" id="live'+idx+'">● LIVE</div></div>'+
 '<div class="cw"><div class="tools"><button id="m'+idx+'">−</button><button id="r'+idx+'">↺</button><button id="p'+idx+'">+</button></div><div id="c'+idx+'" class="chart"></div></div>'+
 '<div class="analysis"><div id="pat'+idx+'" class="pattern">جاري الرسم...</div><div id="sig'+idx+'" class="signal">جاري التحليل...</div><div id="lev'+idx+'" class="levels"></div><div id="why'+idx+'" class="reason"></div></div></section>';
 feed.appendChild(s);return s;
}
function seriesLine(chart,pts,color,width=2,dash=0){
 if(!pts||pts.length<2)return null;
 const s=chart.addLineSeries({color,lineWidth:width,lineStyle:dash?LightweightCharts.LineStyle.Dashed:LightweightCharts.LineStyle.Solid,crosshairMarkerVisible:false,lastValueVisible:false,priceLineVisible:false});
 s.setData(pts);return s;
}
function drawPattern(chart,x){
 const d=x.draw||[];
 d.forEach(o=>{
  if(o.type==="line")seriesLine(chart,o.points,"#8b98aa",2,1);
  if(o.type==="pattern"){
   seriesLine(chart,o.points,"#4da3ff",3,0);
   seriesLine(chart,o.neck,"#ffb84d",2,1);
  }
  if(o.type==="double"){
   seriesLine(chart,o.points,"#b98cff",3,0);
   const pts=o.points.map(p=>({time:p.time,value:o.level}));seriesLine(chart,pts,"#ffb84d",2,1);
  }
  if(o.type==="harmonic"){
   seriesLine(chart,o.points,"#4da3ff",3,0);
   o.points.forEach((p,i)=>chart.addLineSeries({color:"#4da3ff",lineWidth:1,lastValueVisible:false,priceLineVisible:false}).setData([{time:p.time,value:p.value},{time:p.time,value:p.value}]));
   o.ratios.forEach((r,i)=>chart.addPriceLine({price:x.entry*(1+(i+1)*.0001),title:r[0]+" "+r[1].toFixed(3),color:"#9aa6b6",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dotted,axisLabelVisible:true}));
  }
  if(o.type==="zones"){const d=o.demand,s=o.supply;seriesLine(chart,[{time:x.draw?.[0]?.points?.[0]?.time||0,value:d[0]},{time:x.draw?.[0]?.points?.[0]?.time||0,value:d[1]}],"#25d69b",2,1);seriesLine(chart,[{time:x.draw?.[0]?.points?.[0]?.time||0,value:s[0]},{time:x.draw?.[0]?.points?.[0]?.time||0,value:s[1]}],"#ff5b72",2,1)}
  if(o.type==="breakout"){chart.addPriceLine({price:o.level,title:"مستوى الاختراق",color:"#4da3ff",lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true})}
  if(o.type==="candle"){seriesLine(chart,o.points,"#f5c451",3,0)}
  if(o.type==="fib"){
   const hi=o.to.value,lo=o.from.value,span=hi-lo;
   [.382,.5,.618].forEach((r,i)=>chart.addPriceLine({price:hi-span*r,title:(r*100).toFixed(1)+"%",color:"#a78bfa",lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}));
  }
 });
}
async function render(sym,icon,name,idx){
 const el=document.getElementById("c"+idx),chart=LightweightCharts.createChart(el,{layout:{background:{type:"solid",color:"#0a0e14"},textColor:"#8995a4"},grid:{vertLines:{color:"#171e27"},horzLines:{color:"#171e27"}},rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false}});
 const cs=chart.addCandlestickSeries({upColor:"#25d69b",downColor:"#ff5b72",borderUpColor:"#25d69b",borderDownColor:"#ff5b72",wickUpColor:"#25d69b",wickDownColor:"#ff5b72"});
 new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
 let data=[],overlay=[],priceLines=[];
 async function load(){
  try{
   const cfg=await fetch("/api/analysis/config",{cache:"no-store"}).then(r=>r.json());
   const chosen=(cfg[URL_MARKET]||cfg.spot||{}); const method=(chosen.method)||"classic";
   const reverse=!!(chosen.reverse);
   const r=await fetch("/api/analysis/chart?market="+encodeURIComponent(URL_MARKET)+"&symbol="+encodeURIComponent(sym)+"&timeframe="+encodeURIComponent(tf)+"&method="+encodeURIComponent(method)+"&reverse="+(reverse?"true":"false"),{cache:"no-store"});if(!r.ok)throw Error();
   const payload=await r.json(); if(!payload.ok||!payload.candles?.length)throw Error();
   data=payload.candles;cs.setData(data);
   overlay.forEach(s=>{try{chart.removeSeries(s)}catch(e){}});overlay=[];priceLines.forEach(s=>{try{cs.removePriceLine(s)}catch(e){}});priceLines=[];
   const x=detect(data,method);
   const serverSignal=payload.signal;
   if(serverSignal){x.side=serverSignal.side||x.side;x.entry=Number(serverSignal.entry)||x.entry;x.tp1=Number(serverSignal.tp1)||x.tp1;x.tp2=Number(serverSignal.tp2)||x.tp2;x.tp3=Number(serverSignal.tp3)||x.tp3;x.sl=Number(serverSignal.sl)||x.sl;x.confidence=Number(serverSignal.ai)||x.confidence;x.pattern=serverSignal.analysis_name||x.pattern;x.reason=(serverSignal.analysis&&serverSignal.analysis.evidence)||x.reason;}
   const add=(v,t,c)=>{if(Number.isFinite(v))overlay.push(cs.createPriceLine({price:v,title:t,color:c,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true}))};
   add(x.entry,"دخول","#4da3ff");add(x.tp1,"TP1","#25d69b");add(x.tp2,"TP2","#25d69b");add(x.tp3,"TP3","#25d69b");add(x.sl,"SL","#ff5b72");
   drawPattern({addLineSeries:(o)=>{const s=chart.addLineSeries(o);overlay.push(s);return s},addPriceLine:(o)=>{const s=cs.createPriceLine(o);priceLines.push(s);return s}},x);
   document.getElementById("pat"+idx).innerHTML='<span class="badge">'+x.pattern+'</span><span class="badge">'+tf+'</span><span class="badge">الرسم الفعلي</span>';
   const cls=x.side==="شراء"?"green":x.side==="بيع"?"red":"gray";
   document.getElementById("sig"+idx).innerHTML='<span class="'+cls+'">'+x.side+'</span> · AI '+x.confidence+'%';
   document.getElementById("lev"+idx).innerHTML=[["دخول",x.entry],["TP1",x.tp1],["TP2",x.tp2],["TP3",x.tp3],["SL",x.sl]].map(q=>'<div class="lv">'+q[0]+'<b>'+fmt(q[1])+'</b></div>').join("");
   document.getElementById("why"+idx).textContent=x.reason;
   document.getElementById("live"+idx).textContent="● LIVE";
   chart.timeScale().fitContent();
  }catch(e){document.getElementById("live"+idx).textContent="● تعذر جلب البيانات"}}
 document.getElementById("m"+idx).onclick=()=>chart.timeScale().scrollToPosition(10,true);
 document.getElementById("p"+idx).onclick=()=>chart.timeScale().scrollToPosition(-10,true);
 document.getElementById("r"+idx).onclick=()=>chart.timeScale().fitContent();
 await load();setInterval(load,30000);
}
function build(){feed.innerHTML="";COINS.forEach((c,i)=>{make(c[0],c[1],c[2],i);render(c[0],c[1],c[2],i)});}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");tf=b.dataset.t;build()});
build();
</script>
</body></html>
